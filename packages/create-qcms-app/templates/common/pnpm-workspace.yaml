# Docker builds require this workspace file even when local development uses another package manager.
packages:
  - "apps/*"

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true

# Set both keys: inheriting the release-age default does not enable strict refusal.
# Wait out the supply-chain delay or choose an older version rather than adding a permanent exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  "drizzle-orm>@opentelemetry/api": ~1.9.1
  "@hono/otel>@opentelemetry/api": ~1.9.1
