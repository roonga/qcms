# Keep the base app publishes on loopback; widening them would expose plain HTTP beside TLS ingress.
# Use docs/deploy-ingress.md for other ingress topologies.
services:
  caddy:
    # Allow operators to mirror images without forking this file.
    image: ${QCMS_CADDY_IMAGE:-caddy:2-alpine}
    # Only the ingress must be publicly reachable.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      QCMS_PORTAL_DOMAIN: ${QCMS_PORTAL_DOMAIN:?set QCMS_PORTAL_DOMAIN in .env}
      QCMS_ADMIN_DOMAIN: ${QCMS_ADMIN_DOMAIN:?set QCMS_ADMIN_DOMAIN in .env}
      QCMS_ACME_EMAIL: ${QCMS_ACME_EMAIL:?set QCMS_ACME_EMAIL in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist certificates and account keys to avoid re-issuance rate limits after container recreation.
      - qcms-caddy-data:/data
      - qcms-caddy-config:/config
    depends_on:
      portal:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qcms-caddy-data:
  qcms-caddy-config:
