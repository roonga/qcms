name: Prepare Testcontainers
description: >
  Make a Testcontainers job independent of Docker Hub. Pre-pulls the Postgres
  image the @roonga/qcms-db harness boots (from the GHCR mirror when available) and
  exports QCMS_TEST_POSTGRES_IMAGE (issue #74), and disables the Ryuk reaper,
  which was the last image still pulled from Docker Hub (issue #150). Every job
  that runs Testcontainers must use this.

inputs:
  tag:
    description: Image tag to resolve. Must stay on the Postgres major the migrations target.
    required: false
    default: "16-alpine"

runs:
  using: composite
  steps:
    # Disable the reaper only on ephemeral CI runners, which clean up crashed containers at job exit.
    # Local machines must retain it.
    - name: Disable the Ryuk reaper (ephemeral runner, nothing to reap)
      shell: bash
      run: echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "${GITHUB_ENV}"

    # Pre-pulling avoids registry calls during tests. Fall back to Docker Hub for forks without a mirror.
    - name: Resolve and pre-pull the test Postgres image
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.tag }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        # Expected pull failures are conditional; abort on failures in the surrounding plumbing.
        set -euo pipefail

        upstream="postgres:${IMAGE_TAG}"
        owner="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
        mirror="ghcr.io/${owner}/qcms/postgres:${IMAGE_TAG}"

        if docker pull --quiet "${mirror}"; then
          echo "QCMS_TEST_POSTGRES_IMAGE=${mirror}" >> "${GITHUB_ENV}"
          echo "Using the GHCR mirror: ${mirror}"
          exit 0
        fi

        echo "::warning title=Test Postgres mirror unavailable::Could not pull ${mirror}; falling back to Docker Hub (${upstream}). Check that the mirror workflow has run and that the package is public."

        for attempt in 1 2 3; do
          if docker pull --quiet "${upstream}"; then
            echo "QCMS_TEST_POSTGRES_IMAGE=${upstream}" >> "${GITHUB_ENV}"
            echo "Using Docker Hub: ${upstream}"
            exit 0
          fi
          echo "Docker Hub pull attempt ${attempt} of 3 failed."
          sleep $((attempt * 10))
        done

        echo "::error title=Test Postgres image unavailable::Neither ${mirror} nor ${upstream} could be pulled. This is a container-registry failure, not a test failure."
        exit 1

    # Snapshot after pre-pulling so the assertion measures only test-time registry access.
    - name: Snapshot the runner's images (baseline for the no-Docker-Hub check)
      shell: bash
      run: |
        # A failed snapshot must fail here rather than produce a misleading later pull assertion.
        set -euo pipefail
        snapshot="${RUNNER_TEMP}/qcms-images-before.txt"
        docker image ls --format '{{.Repository}}:{{.Tag}}' | sort -u > "${snapshot}"
        echo "QCMS_DOCKER_IMAGE_SNAPSHOT=${snapshot}" >> "${GITHUB_ENV}"
        echo "Baselined $(wc -l < "${snapshot}") image references on the runner."
