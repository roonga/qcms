# Shared runner Docker Hub pulls are rate-limited.
# Make the mirror public after first publish: tests and forks pull anonymously, with Hub fallback.
name: Mirror test images

on:
  # Refresh the mirror to pick up upstream patch and base-image updates.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Concurrent copies of the same tag race with one another.
concurrency:
  group: mirror-test-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Preserve the full multi-architecture manifest without downloading layers to the runner.
      - name: Copy postgres:16-alpine to GHCR
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create \
            --tag "ghcr.io/${owner}/qcms/postgres:16-alpine" \
            docker.io/library/postgres:16-alpine

      - name: Show the mirrored manifest
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "ghcr.io/${owner}/qcms/postgres:16-alpine"
