name: CI

on:
  # Restrict pushes to main to avoid duplicate required contexts for open pull requests.
  push:
    branches: [main]
  pull_request:
    # Retargeting a stacked pull request emits only edited; rerun against its new base.
    types: [opened, synchronize, reopened, edited]
  # Allow required checks to be requested when webhook delivery fails.
  workflow_dispatch:

# Manual recovery runs must survive ordinary pushes; post-merge runs must finish to catch integration failures.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required jobs must always report; classification changes their workload, never their existence.
  changes:
    # Use a distinct name from the classifier job in the browser workflow.
    name: changes (ci)
    runs-on: ubuntu-latest
    # Bound the classifier so it cannot strand every required context.
    timeout-minutes: 5
    outputs:
      plan_only: ${{ steps.classify.outputs.plan_only }}
      # Unknown or missing classification must run the full suite, including shared-package changes.
      admin_only: ${{ steps.classify.outputs.admin_only }}
    steps:
      # The classifier needs merge-base history; a shallow checkout disables the fast lane.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The classifier uses only Node built-ins and must run before dependency installation.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Run the base classifier so a defective head copy cannot certify its own changes as safe to skip.
      - id: classify
        env:
          CLASSIFIER: scripts/ci-plan-only.mjs
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "Event is ${GITHUB_EVENT_NAME}, not pull_request: running the full suite."
            printf 'plan_only=false\nadmin_only=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show "origin/${GITHUB_BASE_REF}:${CLASSIFIER}" > "${RUNNER_TEMP}/classify.mjs"; then
            echo "Classifying with origin/${GITHUB_BASE_REF}:${CLASSIFIER} (not the copy in this PR)."
            node "${RUNNER_TEMP}/classify.mjs"
          else
            echo "::warning::ci-plan-only: ${CLASSIFIER} is absent on origin/${GITHUB_BASE_REF}; running the full suite."
            printf 'plan_only=false\nadmin_only=false\n' >> "$GITHUB_OUTPUT"
          fi

      # Publish classification first; pass untrusted PR text through the environment.
      - name: PR body (written text rule)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-pr-body.mjs

  verify:
    # The branch ruleset requires this exact context name and matrix key.
    name: verify (node-${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Bound hangs in installs or container startup so required checks cannot remain pending indefinitely.
    timeout-minutes: 15
    needs: changes
    # A skipped required job counts as passing; classifier failures must run the full gate.
    if: ${{ !cancelled() }}
    env:
      # Fast-lane jobs still report their required context after running check:plan.
      PLAN_ONLY: ${{ needs.changes.outputs.plan_only }}
    strategy:
      fail-fast: false
      # Exercise cross-runtime hashing and encoding stability.
      matrix:
        node-version: [24, 26]
    continue-on-error: ${{ matrix.node-version == 26 }}
    steps:
      # The append-only guard requires default-branch history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keep check:plan a superset of check:all so new text gates cover the fast lane automatically.
      # Use the PR base for diff guards so stacked branches do not inherit their parent changes.
      - run: pnpm check:plan
        if: env.PLAN_ONLY == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}

      # Build declarations before program-shaped tasks resolve workspace packages.
      - run: pnpm build
        if: env.PLAN_ONLY != 'true'

      - run: pnpm typecheck
        if: env.PLAN_ONLY != 'true'

      - run: pnpm lint
        if: env.PLAN_ONLY != 'true'

      - uses: ./.github/actions/test-postgres-image
        if: env.PLAN_ONLY != 'true'
        with:
          mailpit: "true"

      - run: pnpm test
        if: env.PLAN_ONLY != 'true'

      # Check registry access even when tests fail, since a registry pull may be the cause.
      - uses: ./.github/actions/assert-no-docker-hub-pulls
        if: ${{ !cancelled() && env.PLAN_ONLY != 'true' }}

      # Keep semantic drift visible as its own gate even though the unit suite also covers it.
      - run: pnpm test:golden-drift
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:golden-append-only
        if: env.PLAN_ONLY != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}

      - run: pnpm check:changeset
        if: env.PLAN_ONLY != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}

      # Validate that the changesets assemble into a release plan, beyond naming changed packages.
      - run: pnpm check:changeset-status
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:no-control-chars
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:harness-tags
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:adr-citations
        if: env.PLAN_ONLY != 'true'

      # Every new job must choose its registry guards; the composite actions alone cannot enforce coverage.
      - run: pnpm check:docker-job-guards
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:licenses
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:no-em-dash
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:comments
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:ports
        if: env.PLAN_ONLY != 'true'

      # Search-path precedence silently shadows control tables if data-plane names overlap.
      - run: pnpm check:schema-disjoint
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:paths
        if: env.PLAN_ONLY != 'true'

      # Compare against the pinned upstream manifest offline; missing evidence must not pass.
      - run: pnpm check:a2ra-fidelity
        if: env.PLAN_ONLY != 'true'

      # CI lists gates individually; adding a check only to check:all does not run it here.
      - run: pnpm check:security-hygiene
        if: env.PLAN_ONLY != 'true'

      # Security documentation cites auth internals and must track the resolved dependency.
      - run: pnpm check:vendor-pin
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:admin-theme
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:font-tokens
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:dead-i18n-keys
        if: env.PLAN_ONLY != 'true'

      # The duplication budget permits intentional vertical-slice repetition.
      - run: pnpm check:duplication
        if: env.PLAN_ONLY != 'true'

      - run: pnpm check:lint-coverage
        if: env.PLAN_ONLY != 'true'

      # An unscanned Tailwind source silently produces no CSS even when build and typecheck pass.
      - run: pnpm check:tailwind-sources
        if: env.PLAN_ONLY != 'true'

      # Keep the individually enumerated CI steps in parity with check:all.
      - run: pnpm check:ci-parity
        if: env.PLAN_ONLY != 'true'

      # Committed templates must match regenerated sources, including the published tarball contents.
      - run: pnpm check:templates
        if: env.PLAN_ONLY != 'true'

      - run: pnpm build
        if: env.PLAN_ONLY != 'true'

  # Keep the required context reporting even on the fast lane; guard steps rather than skipping the job.
  api-e2e:
    runs-on: ubuntu-latest
    # Allow for cold container startup while bounding hangs.
    timeout-minutes: 10
    needs: changes
    # Classifier failure must run the suite rather than satisfy the required check with a skip.
    if: ${{ !cancelled() }}
    env:
      PLAN_ONLY: ${{ needs.changes.outputs.plan_only }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan-only change, no product code to exercise
        if: env.PLAN_ONLY == 'true'
        run: echo "Diff is entirely plan and instruction files - reporting api-e2e green without running the suite."

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.PLAN_ONLY != 'true'

      - uses: actions/setup-node@v7
        if: env.PLAN_ONLY != 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.PLAN_ONLY != 'true'

      # @roonga/qcms-db's `.` export resolves to dist, so build the workspace first.
      - run: pnpm build
        if: env.PLAN_ONLY != 'true'

      - uses: ./.github/actions/test-postgres-image
        if: env.PLAN_ONLY != 'true'
        with:
          mailpit: "true"

      - run: pnpm --filter qcms-api exec vitest run --root ../.. --project qcms-api-e2e
        if: env.PLAN_ONLY != 'true'

      - uses: ./.github/actions/assert-no-docker-hub-pulls
        if: ${{ !cancelled() && env.PLAN_ONLY != 'true' }}

  # The aggregate below owns the required context. Shards divide test groups without splitting serial suites.
  browser-e2e-shard:
    name: browser-e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      # Collect every shard verdict; cancellation would fail the aggregate and hide other failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      PLAN_ONLY: ${{ needs.changes.outputs.plan_only }}
      ADMIN_ONLY: ${{ needs.changes.outputs.admin_only }}
      SHARD: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan-only change, no rendered surface to exercise
        if: env.PLAN_ONLY == 'true'
        run: echo "Diff is entirely plan and instruction files - reporting browser-e2e green without running the suite."

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.PLAN_ONLY != 'true'

      - uses: actions/setup-node@v7
        if: env.PLAN_ONLY != 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.PLAN_ONLY != 'true'

      # Build workspace exports before globalSetup composes the API.
      - run: pnpm build
        if: env.PLAN_ONLY != 'true'

      # Lighthouse uses the same Chromium binary and needs its system libraries too.
      - run: pnpm exec playwright install --with-deps chromium
        if: env.PLAN_ONLY != 'true'

      - uses: ./.github/actions/test-postgres-image
        if: env.PLAN_ONLY != 'true'

      - name: Portal and admin browser suites (all Playwright projects)
        run: pnpm exec playwright test --shard="$SHARD/$SHARD_TOTAL"
        if: env.PLAN_ONLY != 'true' && env.ADMIN_ONLY != 'true'

      # Unknown admin-only classification must fall back to all projects. Filter projects before sharding.
      - name: Admin browser suite only (diff cannot reach a portal surface)
        run: pnpm exec playwright test --project admin-chromium --shard="$SHARD/$SHARD_TOTAL"
        if: env.PLAN_ONLY != 'true' && env.ADMIN_ONLY == 'true'

      - uses: ./.github/actions/assert-no-docker-hub-pulls
        if: ${{ !cancelled() && env.PLAN_ONLY != 'true' }}

      # Artifact names must be unique per shard or simultaneous failure uploads overwrite or fail.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && env.PLAN_ONLY != 'true' }}
        with:
          name: browser-e2e-failure-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/portal/.playwright/output
            apps/portal/.playwright/server-logs
          retention-days: 7
          if-no-files-found: warn

  # This exact aggregate name is required by branch protection.
  # Only success from every shard may satisfy it; skipped or unknown results must fail.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: browser-e2e-shard
    if: ${{ !cancelled() }}
    steps:
      - name: Every browser-e2e shard must have succeeded
        env:
          SHARDS: ${{ needs.browser-e2e-shard.result }}
        run: |
          echo "browser-e2e shard matrix: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::At least one browser-e2e shard did not succeed (matrix result: $SHARDS)."
            exit 1
          fi
