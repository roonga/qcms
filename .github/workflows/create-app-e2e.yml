# The adopter experience, proved from packed tarballs (task 037).
#
# Its own workflow rather than a job in e2e.yml, for the same reason `full-stack-e2e`
# is not a job in ci.yml: it builds three application images, so it is minutes long
# and it should say what broke by name in the checks list. It is also the one job
# whose subject is what an adopter receives rather than what this repository runs.
name: create-app-e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id IS the check context, left to name itself, exactly as `full-stack-e2e`
  # and the two e2e jobs in ci.yml are.
  create-app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The harness makes the first commit in the scaffolded project, and git refuses
      # to commit without an identity. A runner has none by default.
      - name: Configure a git identity for the scaffolded project
        run: |
          git config --global user.email "create-app-e2e@qcms.invalid"
          git config --global user.name "create-qcms-app end-to-end"

      # Resolves the mirrored Postgres reference into QCMS_TEST_POSTGRES_IMAGE, as
      # every other Docker-backed job does (issues #74 and #150). The scaffolded
      # Compose file reads it as QCMS_POSTGRES_IMAGE.
      - uses: ./.github/actions/test-postgres-image

      # Packs the five tarballs, runs the CLI from its own tarball into a temporary
      # directory, installs, builds the three images from the scaffolded tree, starts
      # the stack, bootstraps an administrator, drives the 027 scenario-1 loop over
      # HTTP, and tears everything down. Self-contained: there is no separate
      # teardown step because the harness runs its own in a `finally`.
      - name: Scaffold, build, and drive the scenario-1 loop
        env:
          QCMS_PORT_SEAT: "0"
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm qcms:scaffold-e2e
