# Exercise packed tarballs so the test covers what adopters receive.
name: create-app-e2e

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - ".claude/**"
      - "plan/**"
      - "CLAUDE.md"
      - "PROJECT_INSTRUCTIONS.md"
      - "CONTRIBUTING.md"
      - "docs/**/*.md"
      - "!docs/SECURITY_DESIGN.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The scaffold harness commits its initial tree; fresh runners lack a git identity.
      - name: Configure a git identity for the scaffolded project
        run: |
          git config --global user.email "create-app-e2e@qcms.invalid"
          git config --global user.name "create-qcms-app end-to-end"

      # The scaffold reads the resolved test image through QCMS_POSTGRES_IMAGE.
      - uses: ./.github/actions/test-postgres-image

      # Templates need public base references that work for adopters without access to this repository.
      # Pre-pulling changes the runner cache without introducing a private mirror dependency.
      - uses: ./.github/actions/prepull-base-images

      - name: Scaffold, build, and drive the scenario-1 loop
        env:
          QCMS_PORT_SEAT: "0"
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm qcms:scaffold-e2e
