name: Images

# This workflow reports image failures but is not a required branch-protection context.
# Recover a failed main publish with workflow_dispatch.
on:
  # Docs-only pushes publish no SHA tag. Dispatch on main if that commit needs an image.
  push:
    paths-ignore:
      - "**/*.md"
      - "plan/**"
  # Scheduled scans refresh vulnerability findings against unchanged images without publishing them.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Post-merge runs retain verdicts and can race for latest; deploy immutable SHA tags.
# Manual and scheduled runs must not displace commit builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Grant registry and issue-write permissions only to the jobs that need them.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only trusted events can grant the built-in token registry-write scope.
    permissions:
      contents: read
      packages: write

    env:
      # Scheduled scans run on main but must not publish or race with commit builds.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Version stamping needs real commit history rather than a shallow graft.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve the registry namespace
        id: registry
        if: env.PUBLISH == 'true'
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        # A registry repository path must be lowercase and the owner login need not be.
        run: |
          set -euo pipefail
          printf 'namespace=%s\n' \
            "$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" \
            >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # SBOM attestations require the docker-container driver, whose content store ignores daemon pre-pulls.
      # Retry the build only for registry or transport failures; genuine build errors must fail immediately.
      - name: Build the three images with SBOM, provenance and a version stamp
        if: env.PUBLISH != 'true'
        run: |
          bash scripts/retry-registry.sh \
            pnpm qcms:build-images -- \
            --output "${RUNNER_TEMP}/images" \
            --attestations "${RUNNER_TEMP}/attestations"

      # Deploy immutable SHA tags; latest may race between main builds.
      - name: Build and publish the three images to GHCR
        if: env.PUBLISH == 'true'
        env:
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
        run: |
          bash scripts/retry-registry.sh \
            pnpm qcms:build-images -- \
            --output "${RUNNER_TEMP}/images" \
            --attestations "${RUNNER_TEMP}/attestations" \
            --push "${NAMESPACE}" \
            --tag "${GITHUB_SHA}" \
            --tag latest

      # Keep reports even when later build steps fail; a missing artifact must not mask the original failure.
      - name: Upload the SBOM and provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-attestations
          path: ${{ runner.temp }}/attestations/
          if-no-files-found: warn
          retention-days: 90

      - name: Report what was stamped
        run: |
          node -e '
            const { inspectOciArtifact, IMAGES, VERSION_LABEL } = await import("./scripts/build-images.mjs");
            for (const image of IMAGES) {
              const { labels, predicates } = inspectOciArtifact(`${process.env.RUNNER_TEMP}/images/${image.name}`);
              console.log(image.name, labels[VERSION_LABEL], predicates.join(" "));
            }
          ' --input-type=module

  # Scan local SBOMs without registry credentials after publishing.
  # New vulnerability disclosures must report without blocking unrelated pull requests.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Scan any produced SBOM even if a later build step failed; missing evidence must fail the download.
    if: ${{ !cancelled() }}

    permissions:
      contents: read

    env:
      # Update the binary checksum manually after comparing the asset hash with release checksums and API metadata.
      # Observe the release-age hold; Dependabot does not track these environment pins.
      # The asset and digest are architecture-specific.
      GRYPE_VERSION: "0.119.0"
      GRYPE_SHA256: "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b"

      # The binary is pinned; only its vulnerability database needs a network update.
      GRYPE_CHECK_FOR_APP_UPDATE: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The scanner imports only local modules and Node built-ins; no workspace install is needed.

      - name: Fetch the SBOMs this run produced
        uses: actions/download-artifact@v8
        with:
          name: image-attestations
          path: ${{ runner.temp }}/attestations

      - name: Install the scanner, verified against its recorded digest
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  grype.tar.gz\n' "${GRYPE_SHA256}" | sha256sum --check --strict -
          tar --extract --gzip --file grype.tar.gz grype
          ./grype version

      # Only fixable findings can block; report unfixed findings too so they remain visible.
      - name: Scan each image's SBOM
        env:
          QCMS_IMAGE_SCAN_FAIL_ON: critical
          QCMS_IMAGE_SCAN_NOTIFY_ON: high
        run: |
          node scripts/image-scan.mjs \
            --attestations "${RUNNER_TEMP}/attestations" \
            --report "${RUNNER_TEMP}/image-scan" \
            --scanner "${RUNNER_TEMP}/grype"

      # Publish findings even on a red scan; missing summary output must not mask the scan failure.
      - name: Publish the summary on the run page
        if: ${{ !cancelled() }}
        run: cat "${RUNNER_TEMP}/image-scan/summary.md" >> "${GITHUB_STEP_SUMMARY}" || true

      # Retain failure evidence; warn on an empty directory rather than masking the original scan failure.
      - name: Upload the scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-report
          path: ${{ runner.temp }}/image-scan/
          if-no-files-found: warn
          retention-days: 90

  # Confine issue-write permission to scheduled reporting.
  # Report missing scans as failures and suppress unchanged finding sets.
  scan-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scan
    # A failed or missing scan is precisely when scheduled reporting must run.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}

    permissions:
      contents: read
      issues: write

    steps:
      - name: Fetch the scan report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: image-scan-report
          path: ${{ runner.temp }}/image-scan

      - name: File or update the findings issue
        env:
          GH_TOKEN: ${{ github.token }}
          # Without a checkout, gh cannot infer the repository from a remote.
          GH_REPO: ${{ github.repository }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/image-scan"
          title="Image vulnerability scan findings (scheduled run)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          digest=""

          if [ ! -f "${report}/summary.json" ]; then
            body=$(printf 'The scheduled image scan produced no report this week (scan job result: **%s**).\n\nNothing is known about the images from this run. The run log is at %s.\n\nThis is a failure of the scan, not a verdict about the images.' \
              "${SCAN_RESULT}" "${run_url}")
          else
            # jq treats null as zero in addition; assert both keys to avoid suppressing malformed reports.
            reported=$(jq -e '
              if (.reported | type) == "number" and (.reportedUnfixed | type) == "number"
              then .reported + .reportedUnfixed
              else error("summary.json is missing reported or reportedUnfixed")
              end' "${report}/summary.json")
            digest=$(jq -er '.digest' "${report}/summary.json")
            if [ "${reported}" -eq 0 ]; then
              echo "Nothing at or above the reporting floor. No issue to file."
              exit 0
            fi
            # Stay below the issue body limit; the artifact retains the complete report.
            body=$(printf 'Scheduled image scan, run %s.\n\nFindings with no available fix are listed as well as fixable ones: a finding that cannot turn a job red has only this issue to reach anyone, and whether the unfixed ones are accepted is an open Code Owner decision (see `docs/SECURITY_DESIGN.md` section 9).\n\n%s' \
              "${run_url}" "$(head -c 50000 "${report}/summary.md")")
          fi

          existing=$(gh issue list --state open --label security --search "in:title \"$title\"" --json number --jq '.[0].number // empty')

          if [ -n "${existing}" ] && [ -n "${digest}" ]; then
            # Find the last bot digest across body and comments; human replies must not trigger duplicates.
            # API failure may duplicate a report but must never suppress findings.
            previous=$({ gh api "repos/${GH_REPO}/issues/${existing}" --jq .body;
                         gh api --paginate "repos/${GH_REPO}/issues/${existing}/comments" --jq '.[].body'; } 2>/dev/null \
                       | grep -o 'image-scan-digest: [0-9a-f]\{64\}' | tail -1 || true)
            if [ "${previous}" = "image-scan-digest: ${digest}" ]; then
              echo "The reported finding set is unchanged since this job last posted. Not repeating it."
              exit 0
            fi
          fi

          if [ -n "${digest}" ]; then
            # Append the trusted marker last so report content cannot override it.
            body=$(printf '%s\n\n<!-- image-scan-digest: %s -->' "${body}" "${digest}")
          fi

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --label security --body "${body}"
          fi
