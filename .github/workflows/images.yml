name: Images

# Task 036: build the three published images on every push, with an SBOM, provenance
# and a real version stamp, and assert all three are present in the artifact rather
# than trusting that the right flags were passed.
#
# This job builds on every push and PUBLISHES on `main` (issue #763). It used to
# publish nowhere, on the reading that "ADR-20 is explicit that the API container is
# never published at all". That reading was wrong, and correcting it is part of #763.
# ADR-20's text (`docs/adr/core.md`) is that the API publishes no host PORT, and
# `docs/deploy-ingress.md` invariant 4 restates it the same way: a runtime network
# property, that the api container is never internet-reachable and is reached only by
# the two BFFs over the internal network. That stays true however the image is
# distributed. Pushing `ghcr.io/<owner>/qcms-api` is a distribution decision and does
# not touch ADR-20 (Code Owner ruling of 2026-09-02 on issue #763). The build half is
# unchanged and still runs on every branch: a Dockerfile change that breaks the build,
# or drops the version stamp, fails here instead of at an adopter's first
# `docker compose build`.
#
# THIS JOB IS NOT A REQUIRED CONTEXT. `protect-main` requires exactly four
# (`verify (node-24)`, `api-e2e`, `browser-e2e`, `full-stack-e2e`), so a red build here
# reports beside a mergeable pull request rather than blocking it. It is not alone:
# `codeql.yml`'s analyze job and `audit.yml` are in the same position, and that set is
# recorded here rather than left to be rediscovered (issue #468, whose own subject -
# `create-app-e2e` - is a repository-administration change and stays with the Code
# Owner). Enforced and merely reported are different properties; this workflow is the
# second kind, on purpose, because a Docker build is slow and its failures are
# infrastructural rather than semantic. Publishing does not change that: a failed
# publish on `main` reports red after a merge that has already landed, and the recovery
# is a `workflow_dispatch` on `main` rather than a revert.
on:
  # Every push, still - a branch is where a broken Dockerfile is cheapest to find, and
  # this workflow publishes no required context, so it is not part of the duplicate-run
  # problem #496 and #525 were about. What it WAS doing is paying five minutes of image
  # building for pushes that cannot change an image: probe PR #526 changed one markdown
  # file under `plan/` and still cost 5m2s (issue #529, measured).
  #
  # `paths-ignore` skips a push only when EVERY changed path matches, so any push that
  # also touches real source still builds. The two entries are inert by construction
  # rather than by judgement: the three Dockerfiles copy `apps`, `packages`, `scripts`
  # and `tooling` and never `plan/`, and no image's behaviour is decided by a Markdown
  # file anywhere in the tree. Anything less obvious than that belongs on the built
  # side of the line - a filter that silently stops building is a worse outcome than
  # the waste it replaces.
  #
  # PUBLISHING COMPOSES WITH THAT FILTER, and the consequence is worth stating rather
  # than discovering. A docs-only push to `main` still skips the whole workflow, so no
  # run happens and nothing is published for that commit: there is no
  # `ghcr.io/<owner>/qcms-api:<that sha>`, and `:latest` keeps pointing at the last
  # commit that touched a path an image is built from. That is the correct outcome -
  # the images are byte-identical to the ones already published, so a second copy under
  # a new tag would only cost registry storage - but it does mean a published tag is
  # not guaranteed to exist for every commit on `main`. Deploy from a SHA tag that
  # exists (the run that built it is the evidence it does), and use `workflow_dispatch`
  # on `main` if a specific commit needs its own tag minted.
  push:
    paths-ignore:
      - "**/*.md"
      - "plan/**"
  # Weekly, for the `scan` job below and for nothing else (issue #894). The three images
  # are a deterministic function of the tree - the base images are digest-pinned (#372)
  # and the install is `--frozen-lockfile` - so rebuilding the same commit next week
  # produces the same SBOM it produces today. What moves between runs is the
  # vulnerability database, which is published upstream and fetched at scan time. A
  # weekly rebuild-and-scan is therefore how a CVE disclosed against a package already
  # inside a published image becomes visible without anyone pushing a commit. Same shape
  # as `audit.yml`'s weekly `pnpm audit`, an hour later so the two never queue together.
  #
  # A scheduled run deliberately PUBLISHES NOTHING; see the `PUBLISH` env below.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Workflow plus ref, so each branch keeps its own lane and a second push replaces the
# run in flight rather than grinding out three image builds for a tree nobody will
# merge (issue #529, same shape as `ci.yml` and `e2e.yml`).
#
# `main` is carved out of cancellation for the reason `ci.yml` records: two back-to-back
# merges share one group, and cancelling the first leaves no verdict for the commit that
# landed. `workflow_dispatch` is keyed on the run id instead, so a routine push can never
# cancel a manually requested build.
#
# That carve-out is deliberately kept, and it has one consequence for publishing: two
# `main` runs can be in flight at once, so if the older one finishes last it wins the
# race for the moving `:latest` tag. The immutable `:<full sha>` tags are unaffected -
# each run writes only its own - which is why the SHA tag is the deployable identity
# and `:latest` is a convenience. Serialising the publish would mean cancelling a
# pending `main` run, which is exactly the verdict-loss issue #529 carved `main` out
# of; trading a documented tag race for a lost build verdict is the worse deal.
#
# A scheduled run is keyed on the run id for the same reason `workflow_dispatch` is: it
# is not a push and must never displace, or be displaced by, a build of a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only at workflow level, and each job widens from there (issue #894). `packages:
# write` used to be granted here, because GitHub has no per-step permission scope and
# the workflow had one job. It has three now, and only one of them publishes: granting
# the registry credential to the scan and to the issue-filing job as well would be
# handing two jobs a token they have no use for. The per-job blocks below are the whole
# story, and each says what it needs and why.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `packages: write` is the whole credential story for publishing: GHCR accepts the
    # built-in `GITHUB_TOKEN`, so no external registry secret is stored or rotated. It is
    # contained: this workflow triggers only on `push`, `schedule` and
    # `workflow_dispatch`, none of which a fork can fire against this repository, and the
    # push steps themselves are gated on `PUBLISH` below.
    permissions:
      contents: read
      packages: write

    env:
      # Publishing is gated on the REF **and** on the event. A branch push builds and
      # pushes nothing, which is what a pull request wants: the image build stays the
      # cheap early warning it has always been, and no branch can mint a tag anyone
      # might deploy. Keying on the ref rather than on `github.event_name == 'push'`
      # also leaves `workflow_dispatch` on `main` as the escape hatch for a commit whose
      # own push was skipped by `paths-ignore`.
      #
      # The scheduled run is the carve-out (issue #894). It runs on `main` and would
      # otherwise satisfy the ref test, re-minting `:latest` and a second `:<sha>` for a
      # commit that already has one - a publish nobody asked for, racing the `main`
      # lane's own. It exists to feed the scanner, so it builds and stops there.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # imageVersion() stamps the short commit SHA into the label, which needs a
          # real commit rather than the grafted shallow one a default checkout leaves.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve the registry namespace
        id: registry
        if: env.PUBLISH == 'true'
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        # A registry repository path must be lowercase and the owner login need not be.
        run: |
          set -euo pipefail
          printf 'namespace=%s\n' \
            "$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" \
            >> "${GITHUB_OUTPUT}"

      # The built-in token, exactly as mirror-test-images.yml does it. No registry
      # secret exists to leak, and `packages: write` on GITHUB_TOKEN is scoped to this
      # repository's own packages.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `--sbom` needs the docker-container driver, because the default `docker` driver
      # cannot attach attestations. The builder is created by `ensureBuilder()` inside
      # the script rather than by a step here (issue #342): there used to be one of
      # each, and the script's is the one that has to exist anyway, because it is what
      # makes a local `pnpm qcms:build-images` work on a machine that has never run
      # this workflow. buildx itself is already on the runner with no setup action, as
      # mirror-test-images.yml also relies on.
      #
      # Deliberately NOT guarded by .github/actions/assert-no-docker-hub-pulls: the
      # SBOM step pulls docker/buildkit-syft-scanner, and the images build FROM
      # node:24-bookworm-slim. Both are build-time pulls, which is the same exception
      # the full-stack-e2e job already documents for the base image.
      - name: Build the three images with SBOM, provenance and a version stamp
        if: env.PUBLISH != 'true'
        run: |
          pnpm qcms:build-images -- \
            --output "${RUNNER_TEMP}/images" \
            --attestations "${RUNNER_TEMP}/attestations"

      # Two tags per image. The full commit SHA is the immutable one and the identity
      # a deploy should pin; `latest` is the moving convenience. Both are pushed from
      # the same build, and the script only pushes an image that has already passed
      # its SBOM, provenance and version-stamp assertions locally, then reads the
      # pushed manifest back to confirm the attestations survived the export.
      - name: Build and publish the three images to GHCR
        if: env.PUBLISH == 'true'
        env:
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
        run: |
          pnpm qcms:build-images -- \
            --output "${RUNNER_TEMP}/images" \
            --attestations "${RUNNER_TEMP}/attestations" \
            --push "${NAMESPACE}" \
            --tag "${GITHUB_SHA}" \
            --tag latest

      # The SBOM and the provenance, kept (issue #342). They used to be generated,
      # asserted and then thrown away with the runner: the build proved they existed
      # and nothing could read them afterwards, which is the one question an SBOM is
      # for. `--attestations` above writes the in-toto documents out as plain JSON,
      # one file per predicate per image, and this uploads them. The documents rather
      # than the OCI directories they came from: measured on the three images at the
      # time this landed, 9 MB against 376 MB, and nobody re-pulls an image out of a
      # workflow artifact.
      #
      # `!cancelled()` rather than `always()`, so a cancelled run does not spend a
      # minute uploading a half-written directory, and `warn` rather than `error` on
      # an empty one, because the build step failing is already the red that matters.
      - name: Upload the SBOM and provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-attestations
          path: ${{ runner.temp }}/attestations/
          if-no-files-found: warn
          retention-days: 90

      # The build asserts as it goes and fails the step on a missing attestation.
      # This prints what landed, so the log answers "what was in that build" without
      # re-running anything.
      - name: Report what was stamped
        run: |
          node -e '
            const { inspectOciArtifact, IMAGES, VERSION_LABEL } = await import("./scripts/build-images.mjs");
            for (const image of IMAGES) {
              const { labels, predicates } = inspectOciArtifact(`${process.env.RUNNER_TEMP}/images/${image.name}`);
              console.log(image.name, labels[VERSION_LABEL], predicates.join(" "));
            }
          ' --input-type=module

  # Container-image vulnerability scanning, over the SBOM `build` just attached
  # (issue #894, the open half of the #372 ruling that `docs/SECURITY_DESIGN.md` §9
  # recorded as "no container-image vulnerability scanning of any kind").
  #
  # ## Why it is its own job
  #
  # Two reasons, both about what this job is allowed to do. It needs no registry
  # credential, so it should not hold one: `build` keeps `packages: write` and this job
  # has `contents: read` and nothing else. And it must not delay or break publishing -
  # `needs: build` means a red scan reports after the images are already pushed, which
  # is the right order for a report that a newly published CVE can flip overnight.
  #
  # ## Why the SBOM and not the image
  #
  # `grype` accepts a local SBOM document directly (`grype sbom:<file>`), so this job
  # pulls no image and authenticates to no registry. It could not pull one usefully in
  # any case: a branch push publishes nothing, so there would be nothing in GHCR to
  # scan, and every branch would lose the report that makes the gate worth having.
  # The SBOM is on disk as a workflow artifact the moment `build` finishes.
  #
  # ## THIS JOB CANNOT RED AN UNRELATED PULL REQUEST
  #
  # The vulnerability database is fetched at run time, so the verdict is a function of
  # the day as much as of the diff: a CVE published this morning against `perl-base`
  # changes the answer for every branch in flight. That is acceptable **only** because
  # this workflow publishes no required context. `protect-main` requires exactly four
  # (`verify (node-24)`, `api-e2e`, `browser-e2e`, `full-stack-e2e`), and neither this
  # job nor `build` is among them, so a red scan reports beside a mergeable pull request
  # rather than blocking it - the same position `codeql.yml` and `audit.yml` occupy, and
  # the header of this file already records the set. Promoting this job to a required
  # context would turn an upstream publication into a merge blocker for unrelated work
  # and is a Code Owner decision, not a default.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # `!cancelled()` and not `success()`: `build` uploads the attestations even when a
    # later step of it fails, and a scan of the SBOMs that were produced is still worth
    # having. The download step below fails honestly if there is nothing to scan.
    if: ${{ !cancelled() }}

    # Read-only. No registry, no issues, no packages: the artifact comes from `needs`
    # and the vulnerability database from the scanner's own public endpoint.
    permissions:
      contents: read

    env:
      # The scanner, pinned twice over (issue #894, and see #948 on Action pinning).
      #
      # A checksum-verified release binary rather than a third-party Action. Actions in
      # this repository are referenced by tag today and issue #948 asks the Code Owner
      # whether to move to commit SHAs; installing a binary introduces no new Action at
      # all, so this change is compatible with either ruling and adds nothing that would
      # have to be re-pinned under one of them.
      #
      # `GRYPE_SHA256` is the SHA-256 of that exact release asset, recorded here rather
      # than read at run time from the publisher's own `checksums.txt` - verifying an
      # artifact against a file fetched from the same place proves only that the two
      # agree. This is the same property the base-image digests give `docker/*.Dockerfile`:
      # the version is legible, the digest is what is enforced.
      #
      # What "verified" means for the value below, precisely, because a vaguer word
      # invites a reader to assume more: the asset was downloaded and hashed locally,
      # and that hash was compared against two independent publications of it - the
      # release's `grype_<version>_checksums.txt` and the `digest` field the GitHub
      # releases API reports for the asset. The cosign signature over `checksums.txt`
      # (`.sig` and `.pem`, keyless) was NOT checked; no cosign is installed here. A
      # future bump that does check it should say so and widen this note.
      #
      # Bumping is a deliberate edit, because Dependabot does not track a digest in a
      # workflow `env`: take the new version's asset, hash it, confirm the hash against
      # those two publications, wait for the repository's 24-hour release-age hold to
      # pass (CONTRIBUTING, "The release-age hold" - the same reasoning applies with more
      # force to a binary this workflow executes), and record the digest here.
      #
      # linux/amd64 because `runs-on: ubuntu-latest` is amd64. A runner move would need
      # a different asset and a different digest, and the checksum makes that a loud
      # failure rather than a silent one.
      GRYPE_VERSION: "0.119.0"
      GRYPE_SHA256: "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b"

      # The scanner's own "is there a newer grype" call, off. The version is pinned by
      # digest above, so the answer cannot change what this job runs, and a CI job
      # should make the network calls it needs and no others. The vulnerability database
      # fetch is unaffected; that one is the point.
      GRYPE_CHECK_FOR_APP_UPDATE: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No `pnpm install`. `scripts/image-scan.mjs` imports only Node built-ins and two
      # constants from `scripts/build-images.mjs`, so the workspace install `build`
      # needs (it compiles the images from source) buys this job nothing but minutes.

      # v8 is `download-artifact`'s current major and does not track `upload-artifact`'s
      # numbering; it verifies the artifact's digest and fails on a mismatch by default,
      # which is the behaviour to want for a file this job is about to draw conclusions
      # from. Dependabot's `github-actions` ecosystem tracks both.
      - name: Fetch the SBOMs this run produced
        uses: actions/download-artifact@v8
        with:
          name: image-attestations
          path: ${{ runner.temp }}/attestations

      - name: Install the scanner, verified against its recorded digest
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  grype.tar.gz\n' "${GRYPE_SHA256}" | sha256sum --check --strict -
          tar --extract --gzip --file grype.tar.gz grype
          ./grype version

      # The floors live here rather than in the script's defaults so that moving one is
      # a one-line workflow edit a reviewer sees, which is what "configurable" has to
      # mean for a number the Code Owner may want to change.
      #
      # `critical` blocks and `high` is reported, and the two are NOT filtered the same
      # way. Only a finding with a published fix can block, which is an interim while
      # the Code Owner's decision about the base image's unfixed criticals is open.
      # Reporting is never filtered that way: every finding at or above `high` is named
      # by id whether or not a fix exists, because a finding that cannot turn a job red
      # has no other channel. `scripts/image-scan.mjs` argues both at length.
      - name: Scan each image's SBOM
        env:
          QCMS_IMAGE_SCAN_FAIL_ON: critical
          QCMS_IMAGE_SCAN_NOTIFY_ON: high
        run: |
          node scripts/image-scan.mjs \
            --attestations "${RUNNER_TEMP}/attestations" \
            --report "${RUNNER_TEMP}/image-scan" \
            --scanner "${RUNNER_TEMP}/grype"

      # The same summary on the run page, not only in the log (issue #894 fix round).
      # A job log is a place you go when you already suspect something; the job summary
      # is on the run's own page beside the green tick, which is where a finding that
      # cannot turn anything red has a chance of being read. It renders the Markdown,
      # so the three sections and the NO FIX AVAILABLE table arrive as tables.
      #
      # `!cancelled()` and not `success()`: a scan that crossed the blocking floor is
      # exactly the run whose summary someone wants, and `|| true` because a missing
      # file here must never be the reason a run is red - the scan step already said so.
      - name: Publish the summary on the run page
        if: ${{ !cancelled() }}
        run: cat "${RUNNER_TEMP}/image-scan/summary.md" >> "${GITHUB_STEP_SUMMARY}" || true

      # Uploaded whether the scan passed or failed: the report is the evidence either
      # way, and a red scan is exactly when someone wants to read it. It carries the
      # full grype JSON per image, the SPDX document each was produced from, and the
      # Markdown summary, so a finding can be reproduced by hand with the same binary.
      #
      # `warn` and not `error`, for the reason the SBOM upload in `build` already gives:
      # the step that failed is already the red that matters. `main()` creates the report
      # directory before the first scan, so a scan that dies early leaves it empty and
      # `error` would add a second, more confusing failure ("no files found") after the
      # real one. The scheduled job below treats a missing report as news in its own
      # right rather than relying on this step to say so.
      - name: Upload the scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-report
          path: ${{ runner.temp }}/image-scan/
          if-no-files-found: warn
          retention-days: 90

  # The scheduled run's reporting half (issue #894), filed the way `audit.yml` files
  # `pnpm audit` findings: one labeled issue, updated with a comment rather than
  # duplicated, so a weekly advisory lands somewhere a person looks instead of sitting
  # in a workflow artifact nobody opens.
  #
  # Its own job for one reason: `issues: write`. That is the only permission in this
  # workflow that can write anything back to the repository, and it is confined to the
  # job that needs it, on the one event that needs it. A push and a `workflow_dispatch`
  # get the artifact and the run page's job summary, and file nothing.
  #
  # ## What reaches the issue, and what keeps it readable
  #
  # EVERY finding at or above the reporting floor, whether or not a fix exists, named by
  # id, package, version and fix state - the ones with no fix in their own section.
  # `scripts/image-scan.mjs` explains why at length; the short form is that a finding
  # which cannot turn a job red has only this channel, and the Code Owner's open
  # decision about the base image's unfixed criticals is exactly the thing that needs
  # it. An eighth one has to change this issue, not a digit in a table.
  #
  # Two things stop that becoming noise. The script merges a finding seen in all three
  # images into one row naming them, so the listing is about 66 rows rather than 198.
  # And it emits a digest of the reported set, which this job compares against the
  # digest embedded in the last comment: an unchanged week says nothing at all. So the
  # issue moves exactly when the answer moves, and a silent week is itself information.
  #
  # ## A broken scan is reported, not swallowed
  #
  # `audit.yml` files an issue whatever went wrong. If the scan job died before writing
  # a report there is no artifact to download, so the download is allowed to fail and
  # this job says so in the issue instead. A week with no scan and no word would be the
  # worst outcome available.
  scan-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scan
    # `!cancelled()` so that a scan which failed - on a blocking critical, or because it
    # could not run at all - still reaches the issue. That is precisely the week someone
    # needs to read it.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}

    permissions:
      contents: read
      issues: write

    steps:
      - name: Fetch the scan report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: image-scan-report
          path: ${{ runner.temp }}/image-scan

      - name: File or update the findings issue
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` infers the repository from a git remote and this job deliberately does
          # not check the repository out, so it has to be told.
          GH_REPO: ${{ github.repository }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/image-scan"
          title="Image vulnerability scan findings (scheduled run)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          digest=""
          # `jq` rather than a node one-liner: this job has no checkout and so no
          # workspace, and jq is a preinstalled runner tool of the same standing as the
          # `curl`, `tar`, `sha256sum` and `gh` the rest of this workflow already uses.

          if [ ! -f "${report}/summary.json" ]; then
            # No report at all. Say so rather than exiting quietly: the whole point of a
            # scheduled run is that somebody hears from it.
            body=$(printf 'The scheduled image scan produced no report this week (scan job result: **%s**).\n\nNothing is known about the images from this run. The run log is at %s.\n\nThis is a failure of the scan, not a verdict about the images.' \
              "${SCAN_RESULT}" "${run_url}")
          else
            # `jq -e` so a null or a missing key is an error rather than a string that
            # reads as false in the arithmetic test below.
            reported=$(jq -e '.reported + .reportedUnfixed' "${report}/summary.json")
            digest=$(jq -er '.digest' "${report}/summary.json")
            if [ "${reported}" -eq 0 ]; then
              echo "Nothing at or above the reporting floor. No issue to file."
              exit 0
            fi
            # Truncated well under GitHub's 65536-character body limit; the full grype
            # JSON per image is the `image-scan-report` artifact on the run.
            body=$(printf 'Scheduled image scan, run %s.\n\nFindings with no available fix are listed as well as fixable ones: a finding that cannot turn a job red has only this issue to reach anyone, and whether the unfixed ones are accepted is an open Code Owner decision (see `docs/SECURITY_DESIGN.md` section 9).\n\n%s' \
              "${run_url}" "$(head -c 50000 "${report}/summary.md")")
          fi

          existing=$(gh issue list --state open --label security --search "in:title \"$title\"" --json number --jq '.[0].number // empty')

          if [ -n "${existing}" ] && [ -n "${digest}" ]; then
            marker="<!-- image-scan-digest: ${digest} -->"
            # The most recent comment on the issue, or the issue body when it has none.
            # `|| true` because a fresh issue has no comments and an API hiccup here must
            # not stop the findings being filed; the cost of getting this wrong is one
            # duplicate comment.
            latest=$(gh api --paginate "repos/${GH_REPO}/issues/${existing}/comments" --jq '.[].body | @base64' | tail -1 | base64 --decode || true)
            if [ -z "${latest}" ]; then
              latest=$(gh api "repos/${GH_REPO}/issues/${existing}" --jq .body || true)
            fi
            if printf '%s' "${latest}" | grep -qF "${marker}"; then
              echo "The reported finding set is unchanged since the last comment. Not repeating it."
              exit 0
            fi
          fi

          if [ -n "${digest}" ]; then
            body=$(printf '%s\n\n<!-- image-scan-digest: %s -->' "${body}" "${digest}")
          fi

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --label security --body "${body}"
          fi
