name: site
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/site.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/site.yml"
      - "pnpm-lock.yaml"
  # Allow a deploy to be requested when a docs change rides another workflow's path filter.
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time, and cancelling a half-finished one leaves nothing published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A static build of one small site; a longer run means the toolchain is wedged.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter qcms-site typecheck

      - run: pnpm --filter qcms-site build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
