name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_label:
        description: "Optional label for this manual E2E run"
        required: false
        type: string

jobs:
  compose-e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Resolves the mirrored Postgres reference into QCMS_TEST_POSTGRES_IMAGE and
      # pre-pulls it, exactly as every other Docker-backed job does (issues #74 and
      # #150). Compose reads it below as QCMS_POSTGRES_IMAGE.
      - uses: ./.github/actions/test-postgres-image

      # The three application images build FROM node:24-bookworm-slim, which is not
      # mirrored yet: accepted for now because a base-image pull is a build-time
      # dependency this job already has (it builds the images), while the Postgres
      # pull was a run-time one the mirror already covers everywhere else.
      - name: Start Compose E2E stack
        env:
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm docker:up

      - name: Run Compose E2E browser flow
        run: pnpm test:e2e

      - name: Stop Compose E2E stack
        if: ${{ always() }}
        env:
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm docker:down

      - name: Upload E2E report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/compose-e2e/
            test-results/compose-e2e/
          if-no-files-found: ignore
          retention-days: 7
