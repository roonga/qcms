name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_label:
        description: "Optional label for this manual E2E run"
        required: false
        type: string

jobs:
  compose-e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Compose E2E stack
        run: pnpm docker:up

      - name: Run Compose E2E browser flow
        run: pnpm test:e2e

      - name: Stop Compose E2E stack
        if: ${{ always() }}
        run: pnpm docker:down

      - name: Upload E2E report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/compose-e2e/
            test-results/compose-e2e/
          if-no-files-found: ignore
          retention-days: 7
