name: Full-stack E2E

on:
  push:
    branches: [main]
  pull_request:
    # Retargeting emits only edited; rerun the gate against the new base.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Post-merge and manual recovery runs must survive ordinary pushes to retain their verdicts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job outputs cannot cross workflows; share the classifier script while keeping required context names.
  changes:
    name: changes (full-stack-e2e)
    runs-on: ubuntu-latest
    # A classifier hang must not strand the required context.
    timeout-minutes: 5
    outputs:
      plan_only: ${{ steps.classify.outputs.plan_only }}
    steps:
      # The classifier needs merge-base history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Use the base classifier so a defective head copy cannot certify itself as safe to skip.
      - id: classify
        env:
          CLASSIFIER: scripts/ci-plan-only.mjs
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "Event is ${GITHUB_EVENT_NAME}, not pull_request: running the full suite."
            echo "plan_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show "origin/${GITHUB_BASE_REF}:${CLASSIFIER}" > "${RUNNER_TEMP}/classify.mjs"; then
            echo "Classifying with origin/${GITHUB_BASE_REF}:${CLASSIFIER} (not the copy in this PR)."
            node "${RUNNER_TEMP}/classify.mjs"
          else
            echo "::warning::ci-plan-only: ${CLASSIFIER} is absent on origin/${GITHUB_BASE_REF}; running the full suite."
            echo "plan_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Keep the required context reporting on the fast lane; guard steps rather than skipping the job.
  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Classifier failure must run the suite; a skipped required job would count as passing.
    if: ${{ !cancelled() }}
    env:
      PLAN_ONLY: ${{ needs.changes.outputs.plan_only }}

    steps:
      - uses: actions/checkout@v7

      - name: Plan-only change, no stack to boot
        if: env.PLAN_ONLY == 'true'
        run: echo "Diff is entirely plan and instruction files - reporting full-stack-e2e green without building images."

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.PLAN_ONLY != 'true'

      - uses: actions/setup-node@v7
        if: env.PLAN_ONLY != 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.PLAN_ONLY != 'true'

      - name: Build workspace packages
        if: env.PLAN_ONLY != 'true'
        run: pnpm -r build

      - name: Install Playwright Chromium
        if: env.PLAN_ONLY != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Compose consumes the resolved test image as QCMS_POSTGRES_IMAGE.
      - uses: ./.github/actions/test-postgres-image
        if: env.PLAN_ONLY != 'true'

      # Compose uses the daemon image store, so pre-pulling covers both bases and BuildKit frontends.
      - uses: ./.github/actions/prepull-base-images
        if: env.PLAN_ONLY != 'true'

      # Build-time registry pulls are outside the test-time no-Docker-Hub assertion.
      - name: Start full-stack E2E stack
        if: env.PLAN_ONLY != 'true'
        env:
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm docker:up

      - name: Run full-stack E2E browser flow
        if: env.PLAN_ONLY != 'true'
        run: pnpm test:e2e

      - name: Stop full-stack E2E stack
        if: ${{ always() && env.PLAN_ONLY != 'true' }}
        env:
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm docker:down

      - name: Upload E2E report
        if: ${{ always() && env.PLAN_ONLY != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-e2e-report
          path: |
            playwright-report/full-stack-e2e/
            test-results/full-stack-e2e/
          if-no-files-found: ignore
          retention-days: 7
