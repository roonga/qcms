name: Restore drill

# Exercise real dump/restore drift on a schedule without making it a per-push gate.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Concurrent drills would tear down each other's Compose stack.
concurrency:
  group: restore-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    # The budget includes two browser runs, a dump/restore and image builds.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Compose consumes the resolved test image as QCMS_POSTGRES_IMAGE.
      - uses: ./.github/actions/test-postgres-image

      - uses: ./.github/actions/prepull-base-images

      - name: Run the restore drill
        env:
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm qcms:drill-restore

      # A runner killed mid-step may bypass the drill's own cleanup.
      - name: Stop the stack
        if: ${{ always() }}
        env:
          QCMS_POSTGRES_IMAGE: ${{ env.QCMS_TEST_POSTGRES_IMAGE }}
        run: pnpm docker:down

      - name: Upload drill report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill-report
          path: |
            playwright-report/full-stack-e2e/
            test-results/full-stack-e2e/
          if-no-files-found: ignore
          retention-days: 7
