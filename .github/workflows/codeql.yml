name: CodeQL

on:
  push:
    branches: [main]
    # The static site carries no analysable product code.
    paths-ignore:
      - "apps/site/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".changeset/**"
      - ".github/**"
      - "!.github/workflows/**"
      - "!.github/actions/**"
      - "plan/**"
      - "apps/site/**"
      - "CLAUDE.md"
      - "PROJECT_INSTRUCTIONS.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "!docs/SECURITY_DESIGN.md"
      - "!docs/openapi/**"
  schedule:
    # Scan unchanged code against newly published queries.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:javascript-typescript"
