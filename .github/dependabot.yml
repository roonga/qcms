# Explicit Dependabot configuration (issue #68). Security updates for npm run
# regardless of this file; when the npm_and_yarn updater cannot complete in this
# pnpm monorepo (the multi-range failure class of issue #47), the documented path
# is a manual fix per CONTRIBUTING's "Security overrides" section - the overrides
# table there is the removal-condition ledger that the scheduled audit job's
# findings (audit.yml) get triaged against.
#
# Two things worth knowing before triaging an alert here, both re-derived under
# time pressure in issue #332:
#
#   1. "scope: runtime" on a transitive alert is GitHub's inference, not a fact
#      about this graph. Every alert on this repo lands against pnpm-lock.yaml,
#      which does not record which workspace manifest pulled a package in, so the
#      label is unreliable in both directions. Run `pnpm why -r <package>` and
#      read where the path terminates before treating an alert as shipped. Two
#      facts make that trace decisive rather than advisory: a devDependency of a
#      workspace project is never in a published @qcms/* package, and every
#      image in docker/ ships a `pnpm deploy --prod` pruned tree, so a dev-scope
#      transitive cannot reach a runtime image by construction.
#
#   2. A "security_update_not_possible" error is not automatically an override.
#      Dependabot reports it whenever it cannot construct the update itself,
#      which includes the case where the parent's declared range already admits
#      the patched version and only the lockfile is behind. Refresh first
#      (`pnpm update -r --depth Infinity <package>`, then re-read
#      `pnpm why -r <package>`); reach for an override only once the parent range
#      is shown to exclude the fix. #332 was the refresh case.
version: 2
updates:
  # Keep the Actions pins current; low-noise, weekly, grouped.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # npm version updates: weekly, small budget, minor+patch grouped so routine
  # bumps arrive as one reviewable PR instead of a stream. Majors stay individual
  # (they need the CONTRIBUTING risk assessment).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        # better-auth arrives ALONE, never inside the group (issue #606). It is a
        # minor by semver, so without this it lands as one line of an 18-package
        # table - which is exactly how 1.6.26 -> 1.7.1 arrived in PR #716, taking
        # sixteen files' worth of version-specific prose stale with it (issue #483).
        #
        # It is not an ordinary dependency here because three parts of the tree make
        # version-specific claims about its compiled source: `docs/SECURITY_DESIGN.md`
        # documents the admin key-rotation path down to internal file:line offsets,
        # `docs/DEVELOPER_GUIDE.md` names the pinned version as checked-not-inferred,
        # and the auth slice's comments cite the rate limiter and cookie internals.
        # So the cost of an unnoticed bump is not a broken build; it is a security
        # document describing a version the repo no longer ships.
        #
        # This excludes it from the GROUP, it does not ignore it: updates still
        # arrive, they just arrive on their own, where CONTRIBUTING's dependency
        # policy can be applied and the reviewer is looking at one thing.
        # `pnpm check:vendor-pin` is the downstream half, catching the prose drift
        # if a solo bump still lands without the sweep.
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"
    ignore:
      # Types track the RUNTIME major: the engine floor is Node 24 and the
      # node-26 CI leg is an early warning, not the target. Re-enable (or bump
      # manually) when the engine floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Container base images (issue #372). This entry is the load-bearing half of
  # digest pinning and landed in the same change as the digests, deliberately.
  #
  # Before it, this file configured two ecosystems and no container image in the
  # repository was tracked by anything. A floating `node:24-bookworm-slim` at least
  # picked up Debian patches on every rebuild; a frozen digest with nothing bumping
  # it is a base image that ages quietly, so pinning on its own would have been a
  # regression dressed as hardening.
  #
  # Behaviour checked against `dependabot-core` rather than assumed, because
  # GitHub's public documentation does not describe digest handling at all:
  #
  #   - With a digest already present, Dependabot moves the tag and the digest
  #     together (dependabot-core issue #14065).
  #   - It will NOT add a first digest to a tag-only `FROM`; that sits behind the
  #     `docker_pin_digests` experiment and is off by default (PR #14071). So the
  #     first digest on any new `FROM` line is written by hand.
  #   - `FROM ${ARG}` is unsupported (issue #4597, closed not-planned), which is why
  #     `docker/lgtm.Dockerfile` and `docker/seed.Dockerfile` are invisible here:
  #     both take their base from a build argument on purpose, and neither ships to
  #     an adopter.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Digest refreshes and minor moves only; a base-image MAJOR is done by hand
      # (issue #787). The first PR this ecosystem ever opened was #777, proposing
      # node:24 -> 26-bookworm-slim, and it was red on arrival: Node 26 images no
      # longer ship corepack and all three Dockerfiles `RUN corepack enable`. It
      # also crosses the documented `engines >=24` floor, which is a decision about
      # what QCMS supports rather than a dependency bump. A runtime major changes
      # what is inside the image, so it belongs with the engines move and the
      # `@types/node` bump above, in one deliberate change.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Compose images are a SEPARATE ecosystem from `docker` (GA 2025-02-25), so the
  # entry above does not see them. This one covers the image references in the
  # committed Compose files.
  #
  # Its reach was recorded here as smaller than it is, and the correction matters
  # more than the original note did (issue #787). This comment used to say that a
  # variable-substituted reference written `${QCMS_POSTGRES_IMAGE:-postgres:16-alpine}`
  # for the #74 mirror override "is not something Dependabot resolves", and that
  # `docker-compose.dev.yml`'s literal was therefore the only image tracked. **PR #776
  # falsified that**: it moved four references across three Compose files, and three of
  # the four were the variable-default form. Dependabot reads through `${VAR:-...}` and
  # rewrites the default.
  #
  # So the real reach is every image reference in the committed Compose files, and the
  # real limit is a different one: the tag lives in about two dozen places in this
  # repository, most of them outside Compose entirely - the Testcontainers harness
  # default, the #74 GHCR mirror workflow, `scripts/env-reference.mjs`, `docs/`. A
  # Compose-only bump therefore SPLITS the pin rather than moving it, which is half of
  # why #776 was closed. #372 item 4 still holds the question of whether the overrides
  # should go.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # Digest refreshes and minor moves only; a major is done by hand (issue #787).
      # The other half of why #776 was closed: Postgres 16 -> 18 is not an in-place
      # upgrade for an existing volume, it needs pg_upgrade or a dump and restore, and
      # an automated PR that silently changes the data directory format of every
      # developer's and operator's stack is not a dependency bump. Combined with the
      # split above, a Compose-only major is wrong twice over.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
