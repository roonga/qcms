# Trace alert scope with `pnpm why -r`; lockfile labels cannot identify the importing workspace.
# Refresh the lockfile before adding an override; see CONTRIBUTING.md for triage policy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Templates are generated by qcms:sync-templates; independent updates would fail check:templates.
    exclude-paths:
      - "packages/create-qcms-app/templates/**"
    groups:
      # Move CodeMirror as one set at every update level: split copies create incompatible types.
      # The mismatch can pass package typecheck and still fail the Next build.
      codemirror:
        patterns:
          - "@codemirror/*"
      minor-and-patch:
        update-types: ["minor", "patch"]
        # Auth updates need a separate security-internals review.
        # Exclude CodeMirror here so the family group retains ownership at every update level.
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"
          - "@codemirror/*"
    ignore:
      # Keep type declarations aligned with the supported runtime floor.
      # Re-enable major updates when that floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Needs @opentelemetry/api 1.10 and splits drizzle-orm into two copies (about 140 type errors); issue #1255.
      - dependency-name: "@opentelemetry/*"
      # A major breaks the parse5 pairing and changes computed styles in tests; issue #1256.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
  # Dependabot refreshes existing digests but does not add the first one or resolve FROM build arguments.
  # A bump here also needs `pnpm qcms:sync-templates` committed in the same PR.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # A runtime major must move with the engine floor, type declarations and Docker build tooling.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Compose updates also rewrite variable defaults; coordinate shared image pins outside Compose.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # Database majors require an explicit data migration; a Compose-only update cannot perform one.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
