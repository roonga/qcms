<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QCMS · Environment navigation concept</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182333;
        --muted: #526178;
        --line: #dce3ec;
        --paper: #fff;
        --canvas: #f5f7fa;
        --blue: #2456c6;
        --blue-pale: #eaf0fc;
        --green: #1d704b;
        --green-pale: #eaf5ee;
        --amber: #81550e;
        --amber-pale: #fff5de;
        --font: "Lexend", ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.55;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 15px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }
      button:hover,
      .button:hover {
        background: var(--canvas);
        border-color: #a4b0c1;
      }
      button.primary {
        color: white;
        background: var(--blue);
        border-color: var(--blue);
      }
      button.primary:hover {
        background: #1d46a3;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 29px;
        line-height: 1.25;
        letter-spacing: -0.7px;
        margin-bottom: 9px;
      }
      h2 {
        font-size: 18px;
        letter-spacing: -0.25px;
        margin-bottom: 8px;
      }
      h3 {
        font-size: 14px;
        margin-bottom: 4px;
      }
      p {
        margin-bottom: 15px;
      }
      .muted,
      small {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .demo {
        min-height: 48px;
        background: #182333;
        color: white;
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: space-between;
        padding: 7px 24px;
      }
      .demo small {
        color: #d0d9e6;
      }
      .demo select {
        color: white;
        background: #263447;
        border: 1px solid #65758a;
        border-radius: 5px;
        padding: 6px 9px;
        max-width: 250px;
      }
      .demo button {
        min-height: 30px;
        padding: 4px 10px;
        color: white;
        background: transparent;
        border-color: #65758a;
        font-size: 12px;
      }
      .demo-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .shell {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        min-height: calc(100vh - 48px);
      }
      aside {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        padding: 28px 16px 18px;
        background: var(--paper);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        font-weight: 750;
        font-size: 19px;
        letter-spacing: -0.6px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: var(--blue);
        color: white;
        border-radius: 8px;
        font-size: 18px;
      }
      .workspace {
        margin: 27px 9px 26px;
        padding-bottom: 21px;
        border-bottom: 1px solid var(--line);
      }
      .workspace strong {
        display: block;
        font-size: 13px;
      }
      .workspace small {
        display: block;
        margin-bottom: 5px;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      nav a {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 44px;
        padding: 10px 13px;
        color: var(--muted);
        text-decoration: none;
        border-radius: 6px;
        font-weight: 550;
      }
      nav a:hover {
        background: var(--canvas);
      }
      nav a[aria-current="page"] {
        background: var(--blue-pale);
        color: var(--blue);
      }
      nav svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .nav-divider {
        margin: 20px 10px 9px;
        border-top: 1px solid var(--line);
      }
      .account {
        margin-top: auto;
        padding: 30px 12px 0;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        border-radius: 50%;
        background: #e6ebf2;
        font-size: 12px;
        font-weight: 700;
      }
      main {
        padding: 30px 48px 60px;
        min-width: 0;
      }
      .content {
        max-width: 1120px;
        margin: 0 auto;
      }
      .crumb {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        min-height: 24px;
        margin-bottom: 25px;
      }
      .crumb a {
        color: var(--muted);
        text-decoration: none;
      }
      .heading,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .heading {
        align-items: flex-start;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        background: var(--canvas);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .tag.green {
        background: var(--green-pale);
        color: var(--green);
        border-color: #cee4d5;
      }
      .tag.blue {
        background: var(--blue-pale);
        color: var(--blue);
        border-color: #cfdbf4;
      }
      .tag.amber {
        background: var(--amber-pale);
        color: var(--amber);
        border-color: #eddeb7;
      }
      .tabs {
        display: flex;
        gap: 25px;
        border-bottom: 1px solid var(--line);
        margin: 7px 0 26px;
        overflow-x: auto;
      }
      .tabs a {
        white-space: nowrap;
        text-decoration: none;
        padding: 12px 0;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        font-weight: 600;
        font-size: 13px;
      }
      .tabs a[aria-current="page"] {
        color: var(--blue);
        border-color: var(--blue);
      }
      .card {
        padding: 24px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        margin-bottom: 20px;
      }
      .card.flush {
        padding: 0;
        overflow: hidden;
      }
      .card-top {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .card-top h2,
      .card-top p {
        margin-bottom: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 22px;
        align-items: start;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 22px;
      }
      .stat {
        background: white;
        border: 1px solid var(--line);
        padding: 19px 23px;
        border-radius: 8px;
      }
      .stat strong {
        display: block;
        font-size: 28px;
        letter-spacing: -0.5px;
        margin-top: 6px;
      }
      .notice {
        padding: 13px 16px;
        border-radius: 6px;
        background: var(--blue-pale);
        color: #24467d;
        font-size: 12px;
        margin-bottom: 20px;
      }
      .notice.amber {
        background: var(--amber-pale);
        color: var(--amber);
      }
      label.field {
        display: block;
        margin: 19px 0;
        font-weight: 600;
        font-size: 12px;
      }
      label.field input,
      label.field textarea,
      label.field select {
        display: block;
        margin-top: 7px;
        width: 100%;
      }
      input,
      textarea,
      select {
        padding: 10px 11px;
        border: 1px solid #b8c4d4;
        border-radius: 5px;
        background: var(--paper);
        color: var(--ink);
        min-height: 40px;
      }
      textarea {
        resize: vertical;
      }
      input[type="checkbox"] {
        width: 17px;
        min-height: 17px;
        accent-color: var(--blue);
      }
      label.check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 21px 0;
      }
      .check input {
        margin-top: 3px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
        background: #fafbfd;
        font-weight: 650;
      }
      th,
      td {
        padding: 15px 23px;
        border-bottom: 1px solid var(--line);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td {
        font-size: 13px;
      }
      td small {
        display: block;
        margin-top: 3px;
      }
      td button {
        min-height: 33px;
        padding: 5px 11px;
        font-size: 12px;
      }
      .table-scroll {
        overflow-x: auto;
      }
      .text-button {
        padding: 0;
        min-height: 28px;
        border: 0;
        background: transparent;
        color: var(--blue);
      }
      .flow {
        display: flex;
        gap: 0;
        margin: 28px 0;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .stage {
        flex: 1;
        min-width: 125px;
        position: relative;
        border-top: 2px solid #c7d5ec;
        padding: 19px 13px 5px 0;
      }
      .stage::before {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--blue);
        border: 3px solid var(--canvas);
        outline: 1px solid #c7d5ec;
        border-radius: 50%;
        top: -6px;
        left: 0;
      }
      .stage strong {
        display: block;
        font-size: 13px;
        margin-bottom: 7px;
      }
      .stage small {
        display: block;
        margin-top: 6px;
      }
      .env-context {
        background: white;
        border: 1px solid var(--line);
        border-left: 3px solid var(--blue);
        padding: 18px 22px;
        display: flex;
        align-items: end;
        gap: 20px;
        border-radius: 7px;
        margin-bottom: 12px;
      }
      .env-context label {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .env-context select {
        display: block;
        margin-top: 5px;
        min-width: 170px;
      }
      .env-context .tag {
        margin-left: auto;
        margin-bottom: 7px;
      }
      .question-row {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 14px;
      }
      .question-row:last-child {
        border: 0;
      }
      .number {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        background: var(--canvas);
        border-radius: 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .mini-input {
        border: 1px solid var(--line);
        height: 36px;
        width: min(100%, 350px);
        border-radius: 4px;
        margin-top: 9px;
      }
      .version-number {
        font-size: 20px;
        font-weight: 650;
        color: var(--blue);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0;
        width: min(610px, calc(100% - 28px));
        color: var(--ink);
        max-height: 90vh;
      }
      dialog::backdrop {
        background: rgb(18 29 46 / 0.48);
      }
      .dialog-body {
        padding: 28px;
      }
      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
        padding: 18px 28px;
        border-top: 1px solid var(--line);
        background: #fafbfd;
      }
      .comparison {
        display: grid;
        grid-template-columns: 1fr 28px 1fr;
        align-items: center;
        gap: 10px;
        margin: 22px 0;
      }
      .comparison > div {
        padding: 17px;
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .comparison strong {
        display: block;
        font-size: 28px;
        margin-top: 5px;
      }
      .comparison .target {
        border-color: #b8cbef;
        background: var(--blue-pale);
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: #182333;
        border-radius: 8px;
        padding: 13px 20px;
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.15);
        max-width: calc(100% - 30px);
        z-index: 5;
      }
      .toast:empty {
        display: none;
      }
      .empty {
        text-align: center;
        padding: 45px 20px;
      }
      .stack > * + * {
        margin-top: 12px;
      }
      .spaced {
        margin-top: 24px;
      }
      [hidden] {
        display: none !important;
      }
      .skip {
        position: absolute;
        left: 10px;
        top: -100px;
        z-index: 10;
        background: white;
        padding: 12px;
      }
      .skip:focus {
        top: 8px;
      }
      .wizard-steps {
        display: flex;
        gap: 20px;
        padding: 0;
        margin: 0 0 26px;
        list-style: none;
        color: var(--muted);
        font-size: 12px;
      }
      .wizard-steps li {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .wizard-steps span {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: var(--canvas);
        border: 1px solid var(--line);
      }
      .wizard-steps [aria-current="step"] {
        color: var(--blue);
        font-weight: 700;
      }
      .wizard-steps [aria-current="step"] span {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .wizard-select {
        width: 100%;
      }
      .destination-list {
        padding: 0;
        margin: 0;
        border: 0;
      }
      .destination {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 7px;
        margin: 11px 0;
        cursor: pointer;
      }
      .destination:has(input:checked) {
        border-color: var(--blue);
        background: var(--blue-pale);
      }
      .destination input {
        margin-top: 4px;
        min-height: 16px;
        accent-color: var(--blue);
        flex-shrink: 0;
      }
      .destination strong,
      .destination small {
        display: block;
      }
      .destination.unavailable {
        cursor: default;
        background: var(--canvas);
      }
      .restriction {
        color: var(--amber);
        margin-top: 5px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      @media (max-width: 1050px) {
        main {
          padding: 25px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .shell {
          grid-template-columns: 195px minmax(0, 1fr);
        }
      }
      @media (max-width: 700px) {
        .demo {
          align-items: flex-start;
          padding: 10px 15px;
          flex-direction: column;
          gap: 8px;
        }
        .demo-controls {
          flex-wrap: wrap;
        }
        .shell {
          display: block;
        }
        aside {
          padding: 15px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          padding: 0;
        }
        .workspace,
        .account,
        .nav-divider {
          display: none;
        }
        nav {
          margin-top: 14px;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        nav a {
          padding: 8px 10px;
          font-size: 12px;
          white-space: nowrap;
        }
        nav svg {
          display: none;
        }
        main {
          padding: 23px 17px 55px;
        }
        h1 {
          font-size: 25px;
        }
        .heading {
          flex-direction: column;
        }
        .stat-grid {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .stat {
          padding: 13px 17px;
        }
        .stat strong {
          font-size: 23px;
        }
        .env-context {
          flex-wrap: wrap;
          padding: 14px;
          gap: 12px;
        }
        .env-context select {
          min-width: 130px;
          max-width: 100%;
        }
        .env-context .tag {
          margin-left: 0;
        }
        .card {
          padding: 19px;
        }
        th,
        td {
          padding: 13px 16px;
        }
      }
      .application-bar {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 25px;
        border-bottom: 1px solid var(--line);
        background: white;
        position: sticky;
        top: 0;
        z-index: 2;
        min-height: 72px;
      }
      .area-nav {
        flex-direction: row;
        gap: 8px;
      }
      .area-nav a {
        padding: 10px 15px;
      }
      .operations-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #23436f;
        font-size: 18px;
      }
      .operations-brand svg {
        width: 23px;
        height: 23px;
      }
      .operations-scope {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: auto;
      }
      .operations-scope label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
      }
      .operations-scope select {
        display: block;
        margin-top: 4px;
        min-width: 160px;
      }
      .operations-scope .tag {
        align-self: center;
      }
      .section-label {
        margin: 0 13px 9px;
      }
      body[data-mode="operations"] .application-bar {
        background: #edf2fa;
        border-bottom-color: #c5d3e8;
      }
      body[data-mode="operations"] aside {
        background: #f8fafd;
      }
      body[data-mode="operations"] .shell {
        min-height: calc(100vh - 145px);
      }
      @media (max-width: 1100px) {
        .application-bar {
          flex-wrap: wrap;
        }
        .operations-scope {
          order: 3;
          flex-basis: 100%;
          margin-left: 0;
        }
        #operations-exit {
          margin-left: auto;
        }
      }
      @media (max-width: 700px) {
        .application-bar {
          padding: 12px 15px;
          gap: 12px;
          position: static;
        }
        .area-nav {
          display: flex;
          margin: 0;
          gap: 3px;
          flex-wrap: wrap;
        }
        .area-nav a {
          padding: 8px 10px;
        }
        .operations-scope {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 10px;
        }
        .operations-scope select {
          min-width: 0;
          width: 100%;
        }
        .operations-scope .tag {
          justify-self: start;
        }
        .section-label {
          margin: 15px 10px 0;
        }
        .operations-brand {
          font-size: 17px;
        }
      }
      .application-identity {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      .application-identity .brand {
        padding: 0;
      }
      .application-bar #account {
        padding: 0;
        margin: 0 0 0 auto;
        flex-shrink: 0;
      }
      .application-bar #account small {
        display: none;
      }
      .application-bar #account strong {
        font-size: 12px;
      }
      body[data-mode="operations"] .application-bar #account {
        margin-left: 0;
      }
      .rail-context {
        font-weight: 650;
        font-size: 14px;
        padding: 0 13px;
        margin-bottom: 23px;
      }
      .shell.without-rail {
        grid-template-columns: minmax(0, 1fr);
      }
      @media (max-width: 700px) {
        .application-bar {
          flex-wrap: wrap;
        }
        .application-bar #account {
          display: flex;
          order: 1;
          margin-left: auto;
        }
        #application-area {
          order: 2;
          flex-basis: 100%;
        }
        #operations-exit {
          order: 2;
        }
        body[data-mode="operations"] #application-area {
          flex-basis: auto;
        }
        body[data-mode="operations"] .application-bar #account {
          margin-left: auto;
        }
        .rail-context {
          margin-bottom: 8px;
          padding: 0 10px;
        }
        aside #section-label {
          margin-top: 0;
        }
      }
      .operations-entry {
        display: flex;
        align-items: center;
        margin-left: 16px;
        padding-left: 22px;
        border-left: 1px solid var(--line);
      }
      .area-nav .operations-link {
        border: 1px solid #cdd8e9;

        .list-filters {

    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="demo">
      <div><strong>Navigation concept</strong> <small> · Interactive sample data</small></div>
      <div class="demo-controls">
        <label for="persona">Explore as</label>
        <select id="persona">
          <option value="all">Alex · Full access</option>
          <option value="editor">Alex · Editor</option>
          <option value="testeditor">Alex · Test-only editor</option>
          <option value="approver">Morgan · Approver</option>
          <option value="responses">Riley · Response operator</option>
          <option value="owner">Alex · Site owner</option>
          <option value="workspaceowner">Jordan · Workspace owner</option>
        </select>
        <button id="reset">Reset demo</button>
      </div>
    </header>
    <div class="application-bar" role="region" aria-label="Application navigation">
      <div class="application-identity">
        <div class="brand"><span class="brand-mark">q</span> QCMS</div>
      </div>
      <div id="application-area"></div>
      <div id="operations-scope" class="operations-scope"></div>
      <div id="operations-exit"></div>
      <button
        id="appearance"
        class="utility-button"
        type="button"
        data-action="appearance"
        aria-label="Appearance"
        title="Appearance"
      >
        ◐
      </button>
      <div class="account" id="account"></div>
    </div>
    <div class="shell">
      <aside>
        <div id="rail-context" class="rail-context"></div>
        <div id="section-label" class="eyebrow section-label"></div>
        <nav id="nav" aria-label="Primary"></nav>
      </aside>
      <main id="main" tabindex="-1"><div class="content" id="content"></div></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div class="toast" role="status" id="toast"></div>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const escape = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const profiles = {
        all: {
          name: "Alex Chen",
          detail: "Author, approver & owner",
          edit: true,
          release: true,
          responses: true,
          admin: true,
        },
        editor: { name: "Alex Chen", detail: "Forms editor", edit: true, release: true },
        testeditor: {
          name: "Alex Chen",
          detail: "Forms editor · Test only",
          edit: true,
          release: true,
          environments: ["test"],
        },
        approver: { name: "Morgan Lee", detail: "Forms approver", release: true, prod: true },
        responses: { name: "Riley Patel", detail: "Responses viewer & eraser", responses: true },
        owner: { name: "Alex Chen", detail: "Site owner", admin: true },
        workspaceowner: {
          name: "Jordan Blake",
          detail: "Workspace owner",
          ownedWorkspaces: ["Customer experience"],
        },
      };
      const labels = { dev: "Development", test: "Test", stg: "Staging", prod: "Production" };
      const formCatalog = [
        ["onboarding", "Customer onboarding", "Customer experience"],
        ["feedback", "Customer feedback", "Customer experience"],
        ["enquiries", "General enquiries", "Customer experience"],
        ["complaints", "Customer complaints", "Customer experience"],
        ["returns", "Returns request", "Customer experience"],
        ["warranty", "Warranty registration", "Customer experience"],
        ["appointments", "Appointment request", "Customer experience"],
        ["support", "Technical support", "Customer experience"],
        ["accessibility", "Accessibility feedback", "Customer experience"],
        ["subscription", "Subscription preferences", "Customer experience"],
        ["events", "Event registration", "Customer experience"],
        ["research", "Research participation", "Customer experience"],
        ["leave", "Leave request", "People operations"],
        ["expenses", "Expense reimbursement", "Finance"],
        ["new-starter", "New starter details", "People operations"],
        ["training", "Training registration", "People operations"],
        ["equipment", "Equipment request", "People operations"],
        ["exit", "Exit feedback", "People operations"],
        ["wellbeing", "Wellbeing check-in", "People operations"],
        ["recruitment", "Candidate application", "People operations"],
        ["invoice", "Invoice enquiry", "Finance"],
        ["purchase", "Purchase request", "Finance"],
        ["supplier", "Supplier registration", "Finance"],
        ["refund", "Refund approval", "Finance"],
        ["budget", "Budget request", "Finance"],
        ["bank", "Bank details change", "Finance"],
        ["incident", "Incident report", "Compliance"],
        ["privacy", "Privacy request", "Compliance"],
        ["consent", "Consent review", "Compliance"],
        ["risk", "Risk assessment", "Compliance"],
        ["declaration", "Conflict declaration", "Compliance"],
        ["audit", "Audit evidence request", "Compliance"],
      ];
      const forms = Object.fromEntries(formCatalog.map(([id, name]) => [id, name]));
      const formWorkspaces = Object.fromEntries(
        formCatalog.map(([id, , workspace]) => [id, workspace]),
      );
      let operationsListContext = { q: "", status: "all", workspace: "all", sort: "name", page: 1 };
      let role = "all";
      let config, records, versions, draft, questionLabel, historyEntries;
      let wizard = null;
      let deliveryFailures, erasureEvents;
      let operationsContext = { tab: "forms", env: "dev", form: "" };
      let normalContext = { view: "forms", tab: "", form: "onboarding" };
      let toastTimer;
      const person = () => profiles[role];
      const canReadForms = () => Boolean(person().edit || person().release);
      const managedWorkspaces = () =>
        person().admin
          ? [...new Set(Object.values(formWorkspaces))]
          : person().ownedWorkspaces || [];
      const canManageWorkspaces = () => managedWorkspaces().length > 0;
      const canManageWorkspace = (name) =>
        managedWorkspaces().includes(name === "all" ? "Customer experience" : name);
      const envName = (env) => labels[env] || env;
      const isProtected = (env) => env === config.protected;
      const canOperate = (env) =>
        Boolean(
          person().release &&
          (!person().environments || person().environments.includes(env)) &&
          (!isProtected(env) || person().prod || role === "all"),
        );
      const record = (env, form = "onboarding") => records[form][env];
      const tag = (text, kind = "") => '<span class="tag ' + kind + '">' + escape(text) + "</span>";
      const button = (text, action, data = "", primary = false, disabled = false) =>
        '<button type="button" data-action="' +
        action +
        '" ' +
        data +
        (primary ? ' class="primary"' : "") +
        (disabled ? " disabled" : "") +
        ">" +
        escape(text) +
        "</button>";
      const link = (text, hash, cls = "") =>
        '<a class="' + cls + '" href="#' + hash + '">' + escape(text) + "</a>";
      const state = () => {
        const params = new URLSearchParams(location.hash.slice(1));
        const operationsOnly =
          !canReadForms() && !canManageWorkspaces() && !person().admin && person().responses;
        const requestedView = params.get("view");
        const workspaceOnly =
          canManageWorkspaces() &&
          !canReadForms() &&
          !person().admin &&
          !person().responses &&
          !person().release;
        const view = operationsOnly
          ? "operations"
          : workspaceOnly && !["workspaces", "workspace"].includes(requestedView)
            ? "workspaces"
            : requestedView ||
              (canReadForms()
                ? "forms"
                : person().responses
                  ? "operations"
                  : canManageWorkspaces()
                    ? "workspaces"
                    : "administration");
        const selected = forms[params.get("form")] ? params.get("form") : "";
        const form =
          view === "operations"
            ? operationsOnly && requestedView !== "operations"
              ? ""
              : selected
            : selected || "onboarding";
        const rawPage = Number(params.get("page") || 1);
        return {
          view,
          form,
          tab:
            view === "operations" && ["delivery-failures", "erasures"].includes(params.get("tab"))
              ? params.get("tab")
              : view === "operations" && (!form || params.get("tab") === "forms")
                ? "forms"
                : params.get("tab") || (view === "operations" ? "overview" : "draft"),
          env: config.envs.includes(params.get("env")) ? params.get("env") : config.envs[0],
          q: params.get("q") || "",
          status: ["all", "open", "closed", "unreleased"].includes(params.get("status"))
            ? params.get("status")
            : "all",
          workspace: Object.values(formWorkspaces).includes(params.get("workspace"))
            ? params.get("workspace")
            : "all",
          sort:
            ["name", "released", "responses"].includes(params.get("sort")) &&
            (params.get("sort") !== "responses" || person().responses)
              ? params.get("sort")
              : "name",
          page: Number.isSafeInteger(rawPage) && rawPage > 0 ? rawPage : 1,
        };
      };
      const url = (view, tab = "", env = "", form = "onboarding") =>
        new URLSearchParams({
          view,
          ...(tab ? { tab } : {}),
          ...(env ? { env } : {}),
          ...(form && tab !== "forms" ? { form } : {}),
          ...(view === "operations" && !["delivery-failures", "erasures"].includes(tab)
            ? {
                ...(operationsListContext.q ? { q: operationsListContext.q } : {}),
                ...(operationsListContext.status !== "all"
                  ? { status: operationsListContext.status }
                  : {}),
                ...(operationsListContext.workspace !== "all"
                  ? { workspace: operationsListContext.workspace }
                  : {}),
                ...(operationsListContext.sort !== "name"
                  ? { sort: operationsListContext.sort }
                  : {}),
                ...(operationsListContext.page > 1
                  ? { page: String(operationsListContext.page) }
                  : {}),
              }
            : {}),
        }).toString();
      function applyOperationsFilters(reset = false) {
        operationsListContext = reset
          ? { q: "", status: "all", workspace: "all", sort: "name", page: 1 }
          : {
              q: $("#ops-search").value.trim(),
              status: $("#ops-status").value,
              workspace: $("#ops-workspace").value,
              sort: $("#ops-sort").value,
              page: 1,
            };
        if (reset && $("#ops-search")) {
          $("#ops-search").value = "";
          $("#ops-workspace").value = "all";
          $("#ops-status").value = "all";
          $("#ops-sort").value = "name";
        }
        navigate("operations", "forms", state().env, "");
      }
      function navigate(view, tab = "", env = "", form = "onboarding") {
        const next = url(view, tab, env, form);
        if (location.hash.slice(1) === next) render();
        else location.hash = next;
      }
      function notify(message) {
        clearTimeout(toastTimer);
        $("#toast").textContent = message;
        toastTimer = setTimeout(() => {
          $("#toast").textContent = "";
        }, 6500);
      }
      function seed(nextConfig) {
        config = nextConfig || {
          envs: ["dev", "test", "stg", "prod"],
          protected: "prod",
          sequential: true,
          multi: false,
          second: false,
        };
        operationsContext = { tab: "forms", env: config.envs[0], form: "" };
        operationsListContext = { q: "", status: "all", workspace: "all", sort: "name", page: 1 };
        normalContext = { view: "forms", tab: "", form: "onboarding" };
        records = {};
        deliveryFailures = Object.fromEntries(
          config.envs.map((env) => [
            env,
            [
              {
                id: "evt-" + env + "-01",
                form: "onboarding",
                reason: "Endpoint returned 503",
                attempts: 6,
              },
              {
                id: "evt-" + env + "-02",
                form: "feedback",
                reason: "Delivery timed out",
                attempts: 6,
              },
            ],
          ]),
        );
        erasureEvents = Object.fromEntries(
          config.envs.map((env) => [
            env,
            [
              {
                session: "sample-" + env + "-erased-01",
                form: "feedback",
                version: 7,
                reason: "Respondent request",
                at: "27 Oct, 10:00",
              },
            ],
          ]),
        );
        for (const [index, form] of Object.keys(forms).entries()) {
          records[form] = {};
          for (const env of config.envs) {
            const version =
              index > 1 && index % 7 === 0
                ? null
                : config.envs.indexOf(env) < 2 && !isProtected(env)
                  ? 8
                  : 7;
            records[form][env] = {
              version,
              closed: version !== null && index > 1 && (index + config.envs.indexOf(env)) % 4 === 0,
              history: version === null ? [] : [7, ...(version === 8 ? [8] : [])],
              links: [],
              webhook: "https://example.com/" + env + "/events",
              proposal: null,
              responses: version === null ? 0 : (isProtected(env) ? 124 : 6) + index * 3,
              lastReleased:
                version === null
                  ? null
                  : Date.UTC(2026, 9, 27, 11, 20) -
                    index * 3600000 -
                    config.envs.indexOf(env) * 1800000,
            };
          }
        }
        versions = [
          {
            number: 8,
            author: "Morgan Lee",
            title: "Customer onboarding",
            question: "Work email address",
            note: "Clarified contact details and added an optional company field.",
          },
          {
            number: 7,
            author: "Morgan Lee",
            title: "Customer onboarding",
            question: "Email address",
            note: "Current customer onboarding baseline.",
          },
        ];
        draft = { title: "Customer onboarding", question: "Work email address", company: true };
        questionLabel = "Work email address";
        historyEntries = [];
      }
      function eligibility(env, version) {
        if (!canOperate(env)) return "An approver with access to this environment is required.";
        if (config.second && isProtected(env) && version.author === person().name)
          return (
            "A different approver must release this version. It was published by " +
            version.author +
            "."
          );
        const index = config.envs.indexOf(env);
        if (
          config.sequential &&
          index > 0 &&
          !record(env).history.includes(version.number) &&
          !record(config.envs[index - 1]).history.includes(version.number)
        )
          return (
            "Release v" +
            version.number +
            " to " +
            envName(config.envs[index - 1]) +
            " first, as required by this site's flow."
          );
        return "";
      }
      function icon(type) {
        const paths = {
          forms:
            '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
          questions:
            '<path d="M9 8a3 3 0 1 1 5 2c-2 1-2 2-2 3M12 17h.01"/><circle cx="12" cy="12" r="10"/>',
          operations: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
          administration:
            '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
        };
        return (
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">' +
          paths[type] +
          "</svg>"
        );
      }
      function tabs(items, current, makeUrl) {
        return (
          '<div class="tabs" aria-label="Section">' +
          items
            .map(
              ([id, text]) =>
                '<a href="#' +
                makeUrl(id) +
                '"' +
                (id === current ? ' aria-current="page"' : "") +
                ">" +
                escape(text) +
                "</a>",
            )
            .join("") +
          "</div>"
        );
      }
      function header(title, subtitle, actions = "", badge = "") {
        const scope = state();
        const workspaceLabel =
          scope.view === "operations"
            ? scope.form && scope.tab !== "forms"
              ? formWorkspaces[scope.form]
              : "Operations"
            : scope.view === "settings"
              ? "Your account"
              : ["workspaces", "workspace", "administration"].includes(scope.view)
                ? "Installation"
                : "Customer experience";
        return (
          '<div class="heading"><div><div class="eyebrow">' +
          escape(workspaceLabel) +
          "</div><h1>" +
          escape(title) +
          '</h1><div class="muted">' +
          escape(subtitle) +
          '</div></div><div class="actions">' +
          badge +
          actions +
          "</div></div>"
        );
      }
      function operationalSections() {
        return [
          ["overview", "Overview"],
          ...(person().responses ? [["responses", "Responses"]] : []),
          ...(person().release
            ? [
                ["links", "Links"],
                ["webhooks", "Webhooks"],
              ]
            : []),
        ];
      }
      function workspaceUrl(name, tab = "members") {
        return url("workspace", tab, "", "") + "&workspace=" + encodeURIComponent(name);
      }
      function exitOperationsUrl() {
        if (
          normalContext.view === "settings" ||
          (normalContext.view === "workspaces" && canManageWorkspaces())
        )
          return url(normalContext.view, normalContext.tab, "", "");
        if (normalContext.view === "workspace" && canManageWorkspace(normalContext.workspace))
          return workspaceUrl(normalContext.workspace, normalContext.tab);
        if (normalContext.view === "administration" && person().admin) return url("administration");
        if (canReadForms())
          return url(
            ["forms", "form", "questions"].includes(normalContext.view)
              ? normalContext.view
              : "forms",
            normalContext.tab,
            "",
            normalContext.form,
          );
        return person().admin
          ? url("administration")
          : canManageWorkspaces()
            ? url("workspaces", "", "", "")
            : "";
      }
      function operationsScope(s) {
        return (
          '<label for="ops-env">Environment<select id="ops-env" aria-label="Environment">' +
          config.envs
            .map(
              (env) =>
                '<option value="' +
                env +
                '"' +
                (env === s.env ? " selected" : "") +
                ">" +
                escape(envName(env)) +
                "</option>",
            )
            .join("") +
          "</select></label>" +
          tag(
            isProtected(s.env) ? "Production data" : "Non-production data",
            isProtected(s.env) ? "amber" : "blue",
          )
        );
      }
      function render() {
        const s = state();
        const operationsAllowed = Boolean(person().release || person().responses);
        const operationsMode = s.view === "operations" && operationsAllowed;
        const workspaceMode = ["workspaces", "workspace"].includes(s.view) && canManageWorkspaces();
        if (operationsMode) {
          operationsContext = { tab: "forms", env: s.env, form: "" };
          if (!["delivery-failures", "erasures"].includes(s.tab))
            operationsListContext = {
              q: s.q,
              status: s.status,
              workspace: s.workspace,
              sort: s.sort,
              page: s.page,
            };
        } else if (
          (["forms", "form", "questions"].includes(s.view) && canReadForms()) ||
          (s.view === "administration" && person().admin) ||
          s.view === "settings"
        )
          normalContext = { view: s.view, tab: s.tab, form: s.form, workspace: s.workspace };
        document.body.dataset.mode = operationsMode
          ? "operations"
          : workspaceMode
            ? "workspaces"
            : "normal";
        const areas = [];
        if (canReadForms())
          areas.push(
            ["questions", "Questions", url("questions")],
            ["forms", "Forms", url("forms")],
          );
        if (operationsAllowed)
          areas.push([
            "operations",
            "Operations",
            url("operations", operationsContext.tab, operationsContext.env, operationsContext.form),
          ]);
        if (canManageWorkspaces())
          areas.push(["workspaces", "Workspaces", url("workspaces", "", "", "")]);
        if (person().admin)
          areas.push(["administration", "Site configuration", url("administration")]);
        $("#application-area").innerHTML = workspaceMode
          ? '<div class="operations-brand">' +
            icon("administration") +
            '<strong>Workspaces</strong></div><nav class="operations-tools" aria-label="Workspace areas">' +
            link("All workspaces", url("workspaces", "", "", "")) +
            "</nav>"
          : operationsMode
            ? '<div class="operations-brand">' +
              icon("operations") +
              '<strong>Operations</strong></div><nav class="operations-tools" aria-label="Operations areas">' +
              [
                ["forms", "Forms"],
                ...(person().release ? [["delivery-failures", "Delivery failures"]] : []),
                ...(person().responses ? [["erasures", "Erasure log"]] : []),
              ]
                .map(
                  ([id, label]) =>
                    '<a href="#' +
                    url("operations", id, s.env, "") +
                    '"' +
                    (s.tab === id ? ' aria-current="page"' : "") +
                    ">" +
                    escape(label) +
                    "</a>",
                )
                .join("") +
              "</nav>"
            : '<nav class="area-nav" aria-label="Application areas">' +
              areas
                .filter(([id]) => id !== "operations")
                .map(
                  ([id, label, target]) =>
                    '<a href="#' +
                    target +
                    '"' +
                    ((id === "forms" && s.view === "form") ||
                    (id === "workspaces" && s.view === "workspace") ||
                    id === s.view
                      ? ' aria-current="page"'
                      : "") +
                    ">" +
                    escape(label) +
                    "</a>",
                )
                .join("") +
              (operationsAllowed
                ? '<span class="operations-entry"><a class="operations-link" href="#' +
                  url(
                    "operations",
                    operationsContext.tab,
                    operationsContext.env,
                    operationsContext.form,
                  ) +
                  '">' +
                  icon("operations") +
                  '<span>Operations</span><span aria-hidden="true">→</span></a></span>'
                : "") +
              "</nav>";
        $("#operations-scope").hidden = !operationsMode;
        $("#operations-scope").innerHTML = operationsMode ? operationsScope(s) : "";

        }
        if (action === "retry-all" && canOperate(s.env)) {
          deliveryFailures[s.env] = [];
          render();
          return notify("Sample deliveries queued for retry in " + envName(s.env) + ".");
        }
        if (action === "cancel") return closeModal();
        if (action === "preview")
          modal(
            '<div class="eyebrow">Draft preview · Hypothetical answers</div><h2 id="dialog-title">' +
              escape(draft.title) +
              '</h2><label class="field">' +
              escape(draft.question) +
              '<input type="email" placeholder="you@example.com"></label>' +
              (draft.company
                ? '<label class="field">Company name <span class="muted">(optional)</span><input></label>'
                : "") +
              '<p class="muted">This preview creates no respondent session.</p>',
            button("Done", "cancel", "", true),
          );
        if (action === "update-question") {
          draft.question = questionLabel;
          render();
          notify("Draft reference updated. Published versions are unchanged.");
        }
        if (action === "publish-question" && person().edit) {
          questionLabel = $("#library-label").value;
          notify("New question version published. Update the form draft to use it.");
        }
        if (action === "snapshot")
          snapshot(versions.find((v) => v.number === Number(el.dataset.version)));
        if (action === "publish-wizard" && canReadForms()) startWizard();
        if (action === "wizard-back" && wizard) {
          wizard.step -= 1;
          renderWizard();
        }
        if (action === "wizard-next" && wizard) {
          if (wizard.step === 1) {
            if (
              wizard.selection === "draft" &&
              (!wizardCandidate().title.trim() || !wizardCandidate().question.trim())
            )
              return;
            wizard.step = 2;
          } else if (wizard.step === 2) {
            const targets = selectedTargets();
            if (!wizard.library && (!targets.length || targets.some(destinationReason))) return;
            wizard.expected = Object.fromEntries(targets.map((env) => [env, record(env).version]));
            wizard.step = 3;
          }
          renderWizard();
        }
        if (action === "wizard-confirm") confirmWizard();
        if (action === "wizard-operations" && wizard?.step === 4) {
          const env = el.dataset.env;
          if (!selectedTargets().includes(env)) return;
          closeModal();
          navigate("operations", "overview", env);
        }
        if (action === "intake" && canOperate(s.env)) {
          record(s.env, s.form).closed = !record(s.env, s.form).closed;
          render();
          notify(
            envName(s.env) + " intake " + (record(s.env, s.form).closed ? "closed." : "reopened."),
          );
        }
        if (action === "create-link" && canOperate(s.env)) {
          const r = record(s.env, s.form);
          r.links.push({
            path:
              (isProtected(s.env) ? "" : "/" + s.env) + "/l/sample-link-" + (r.links.length + 1),
            revoked: false,
          });
          render();
          notify("Sample secure link created for " + envName(s.env) + ".");
        }
        if (action === "revoke-link" && canOperate(s.env)) {
          record(s.env, s.form).links[Number(el.dataset.index)].revoked = true;
          render();
          notify("Link revoked in " + envName(s.env) + ".");
        }
        if (action === "export" && person().responses) {
          const csv =
            "session,environment,form,version,status\nsample-001," +
            s.env +
            "," +
            s.form +
            "," +
            record(s.env, s.form).version +
            ",submitted\n";
          const objectUrl = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
          const anchor = document.createElement("a");
          anchor.href = objectUrl;
          anchor.download = "sample-" + s.env + "-responses.csv";
          anchor.click();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
          notify("Sample " + envName(s.env) + " responses exported.");
        }
        if (action === "webhook" && canOperate(s.env)) {
          const input = $("#webhook-url");
          if (!input.reportValidity()) return;
          let endpoint;
          try {
            endpoint = new URL(input.value);
          } catch {
            return notify("Enter a valid HTTPS endpoint.");
          }
          if (endpoint.protocol !== "https:") return notify("Use an HTTPS endpoint.");
          const r = record(s.env, s.form);
          if (config.second && isProtected(s.env))
            r.proposal = { url: endpoint.href, author: person().name };
          else r.webhook = endpoint.href;
          render();
          notify(
            r.proposal
              ? "Proposal pending. A different approver must confirm."
              : "Endpoint updated in " + envName(s.env) + ".",
          );
        }
        if (action === "confirm-webhook" && canOperate(s.env)) {
          const r = record(s.env, s.form);
          if (r.proposal && r.proposal.author !== person().name) {
            r.webhook = r.proposal.url;
            r.proposal = null;
            render();
            notify("Endpoint change confirmed.");
          }
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id.startsWith("draft-")) captureDraft();
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "wizard-version" && wizard) {
          wizard.selection = event.target.value;
          wizard.targets = null;
          wizard.library = false;
          renderWizard();
          $("#wizard-version").focus();
        }
        if (event.target.name === "wizard-environment" && wizard) {
          const control = event.target.value;
          if (control === "library") {
            wizard.library = event.target.checked;
            if (wizard.library) wizard.targets = [];
          } else {
            wizard.library = false;
            wizard.targets = event.target.checked
              ? config.multi
                ? [...new Set([...wizard.targets, control])]
                : [control]
              : wizard.targets.filter((env) => env !== control);
          }
          renderWizard();
          document
            .querySelector('input[name="wizard-environment"][value="' + control + '"]')
            ?.focus();
        }
        if (event.target.id === "draft-company") captureDraft();
        if (event.target.id === "ops-env") {
          const current = state();
          operationsListContext.page = 1;
          navigate(
            "operations",
            current.tab,
            $("#ops-env").value,
            current.tab === "forms" ? "" : current.form,
          );
        }
        if (["ops-workspace", "ops-status", "ops-sort"].includes(event.target.id))
          applyOperationsFilters();
        if (event.target.id === "flow-preset") {
          const presets = {
            single: ["prod"],
            pair: ["test", "prod"],
            four: ["dev", "test", "stg", "prod"],
            flexible: ["dev", "test", "stg", "prod"],
          };
          const names = presets[event.target.value];
          if (names) {
            $("#flow-envs").value = names.join(", ");
            $("#flow-protected").value = "prod";
            $("#flow-sequential").checked = event.target.value !== "flexible" && names.length > 1;
            $("#flow-multi").checked = event.target.value === "flexible";
          }
        }
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id === "ops-filter-form") {
          event.preventDefault();
          applyOperationsFilters();
          return;
        }
        if (event.target.id !== "flow-form") return;
        event.preventDefault();
        const envs = $("#flow-envs")
          .value.split(",")
          .map((x) => x.trim());
        const protectedEnv = $("#flow-protected").value.trim();
        if (!envs.includes(protectedEnv))
          return notify("The protected production environment must be in the environment list.");
        if (new Set(envs).size !== envs.length)
          return notify("Use a unique name for each environment.");
        seed({
          envs,
          protected: protectedEnv,
          sequential: $("#flow-sequential").checked,
          multi: $("#flow-multi").checked,
          second: $("#flow-second").checked,
        });
        render();
        notify("Demo flow applied.");
      });
      $("#persona").addEventListener("change", (event) => {
        captureDraft();
        if ($("#dialog").open) closeModal();
        role = event.target.value;
        const destination = canReadForms()
          ? "form"
          : person().responses
            ? "operations"
            : canManageWorkspaces()
              ? "workspaces"
              : "administration";
        navigate(
          destination,
          destination === "operations" ? "forms" : canReadForms() ? "versions" : "",
          state().env,
          destination === "operations" ? "" : "onboarding",
        );
      });
      $("#reset").addEventListener("click", () => {
        if ($("#dialog").open) closeModal();
        seed();
        role = "all";
        $("#persona").value = role;
        navigate("forms");
        notify("Sample data reset.");
      });
      $("#dialog").addEventListener("click", (event) => {
        if (event.target === $("#dialog")) closeModal();
      });
      window.addEventListener("hashchange", () => {
        render();
        $("#main").focus({ preventScroll: true });
      });
      seed();
      render();
    </script>
  </body>
</html>
