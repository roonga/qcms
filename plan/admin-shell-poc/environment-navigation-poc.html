<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QCMS · Environment navigation concept</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182333;
        --muted: #526178;
        --line: #dce3ec;
        --paper: #fff;
        --canvas: #f5f7fa;
        --blue: #2456c6;
        --blue-pale: #eaf0fc;
        --green: #1d704b;
        --green-pale: #eaf5ee;
        --amber: #81550e;
        --amber-pale: #fff5de;
        --font: "Lexend", ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.55;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 15px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }
      button:hover,
      .button:hover {
        background: var(--canvas);
        border-color: #a4b0c1;
      }
      button.primary {
        color: white;
        background: var(--blue);
        border-color: var(--blue);
      }
      button.primary:hover {
        background: #1d46a3;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 29px;
        line-height: 1.25;
        letter-spacing: -0.7px;
        margin-bottom: 9px;
      }
      h2 {
        font-size: 18px;
        letter-spacing: -0.25px;
        margin-bottom: 8px;
      }
      h3 {
        font-size: 14px;
        margin-bottom: 4px;
      }
      p {
        margin-bottom: 15px;
      }
      .muted,
      small {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .demo {
        min-height: 48px;
        background: #182333;
        color: white;
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: space-between;
        padding: 7px 24px;
      }
      .demo small {
        color: #d0d9e6;
      }
      .demo select {
        color: white;
        background: #263447;
        border: 1px solid #65758a;
        border-radius: 5px;
        padding: 6px 9px;
        max-width: 250px;
      }
      .demo button {
        min-height: 30px;
        padding: 4px 10px;
        color: white;
        background: transparent;
        border-color: #65758a;
        font-size: 12px;
      }
      .demo-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .shell {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        min-height: calc(100vh - 48px);
      }
      aside {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        padding: 28px 16px 18px;
        background: var(--paper);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        font-weight: 750;
        font-size: 19px;
        letter-spacing: -0.6px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: var(--blue);
        color: white;
        border-radius: 8px;
        font-size: 18px;
      }
      .workspace {
        margin: 27px 9px 26px;
        padding-bottom: 21px;
        border-bottom: 1px solid var(--line);
      }
      .workspace strong {
        display: block;
        font-size: 13px;
      }
      .workspace small {
        display: block;
        margin-bottom: 5px;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      nav a {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 44px;
        padding: 10px 13px;
        color: var(--muted);
        text-decoration: none;
        border-radius: 6px;
        font-weight: 550;
      }
      nav a:hover {
        background: var(--canvas);
      }
      nav a[aria-current="page"] {
        background: var(--blue-pale);
        color: var(--blue);
      }
      nav svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .nav-divider {
        margin: 20px 10px 9px;
        border-top: 1px solid var(--line);
      }
      .account {
        margin-top: auto;
        padding: 30px 12px 0;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        border-radius: 50%;
        background: #e6ebf2;
        font-size: 12px;
        font-weight: 700;
      }
      main {
        padding: 30px 48px 60px;
        min-width: 0;
      }
      .content {
        max-width: 1120px;
        margin: 0 auto;
      }
      .crumb {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        min-height: 24px;
        margin-bottom: 25px;
      }
      .crumb a {
        color: var(--muted);
        text-decoration: none;
      }
      .heading,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .heading {
        align-items: flex-start;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        background: var(--canvas);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .tag.green {
        background: var(--green-pale);
        color: var(--green);
        border-color: #cee4d5;
      }
      .tag.blue {
        background: var(--blue-pale);
        color: var(--blue);
        border-color: #cfdbf4;
      }
      .tag.amber {
        background: var(--amber-pale);
        color: var(--amber);
        border-color: #eddeb7;
      }
      .tabs {
        display: flex;
        gap: 25px;
        border-bottom: 1px solid var(--line);
        margin: 7px 0 26px;
        overflow-x: auto;
      }
      .tabs a {
        white-space: nowrap;
        text-decoration: none;
        padding: 12px 0;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        font-weight: 600;
        font-size: 13px;
      }
      .tabs a[aria-current="page"] {
        color: var(--blue);
        border-color: var(--blue);
      }
      .card {
        padding: 24px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        margin-bottom: 20px;
      }
      .card.flush {
        padding: 0;
        overflow: hidden;
      }
      .card-top {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .card-top h2,
      .card-top p {
        margin-bottom: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 22px;
        align-items: start;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 22px;
      }
      .stat {
        background: white;
        border: 1px solid var(--line);
        padding: 19px 23px;
        border-radius: 8px;
      }
      .stat strong {
        display: block;
        font-size: 28px;
        letter-spacing: -0.5px;
        margin-top: 6px;
      }
      .notice {
        padding: 13px 16px;
        border-radius: 6px;
        background: var(--blue-pale);
        color: #24467d;
        font-size: 12px;
        margin-bottom: 20px;
      }
      .notice.amber {
        background: var(--amber-pale);
        color: var(--amber);
      }
      label.field {
        display: block;
        margin: 19px 0;
        font-weight: 600;
        font-size: 12px;
      }
      label.field input,
      label.field textarea,
      label.field select {
        display: block;
        margin-top: 7px;
        width: 100%;
      }
      input,
      textarea,
      select {
        padding: 10px 11px;
        border: 1px solid #b8c4d4;
        border-radius: 5px;
        background: var(--paper);
        color: var(--ink);
        min-height: 40px;
      }
      textarea {
        resize: vertical;
      }
      input[type="checkbox"] {
        width: 17px;
        min-height: 17px;
        accent-color: var(--blue);
      }
      label.check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 21px 0;
      }
      .check input {
        margin-top: 3px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
        background: #fafbfd;
        font-weight: 650;
      }
      th,
      td {
        padding: 15px 23px;
        border-bottom: 1px solid var(--line);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td {
        font-size: 13px;
      }
      td small {
        display: block;
        margin-top: 3px;
      }
      td button {
        min-height: 33px;
        padding: 5px 11px;
        font-size: 12px;
      }
      .table-scroll {
        overflow-x: auto;
      }
      .text-button {
        padding: 0;
        min-height: 28px;
        border: 0;
        background: transparent;
        color: var(--blue);
      }
      .flow {
        display: flex;
        gap: 0;
        margin: 28px 0;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .stage {
        flex: 1;
        min-width: 125px;
        position: relative;
        border-top: 2px solid #c7d5ec;
        padding: 19px 13px 5px 0;
      }
      .stage::before {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--blue);
        border: 3px solid var(--canvas);
        outline: 1px solid #c7d5ec;
        border-radius: 50%;
        top: -6px;
        left: 0;
      }
      .stage strong {
        display: block;
        font-size: 13px;
        margin-bottom: 7px;
      }
      .stage small {
        display: block;
        margin-top: 6px;
      }
      .env-context {
        background: white;
        border: 1px solid var(--line);
        border-left: 3px solid var(--blue);
        padding: 18px 22px;
        display: flex;
        align-items: end;
        gap: 20px;
        border-radius: 7px;
        margin-bottom: 12px;
      }
      .env-context label {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .env-context select {
        display: block;
        margin-top: 5px;
        min-width: 170px;
      }
      .env-context .tag {
        margin-left: auto;
        margin-bottom: 7px;
      }
      .question-row {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 14px;
      }
      .question-row:last-child {
        border: 0;
      }
      .number {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        background: var(--canvas);
        border-radius: 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .mini-input {
        border: 1px solid var(--line);
        height: 36px;
        width: min(100%, 350px);
        border-radius: 4px;
        margin-top: 9px;
      }
      .version-number {
        font-size: 20px;
        font-weight: 650;
        color: var(--blue);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0;
        width: min(610px, calc(100% - 28px));
        color: var(--ink);
        max-height: 90vh;
      }
      dialog::backdrop {
        background: rgb(18 29 46 / 0.48);
      }
      .dialog-body {
        padding: 28px;
      }
      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
        padding: 18px 28px;
        border-top: 1px solid var(--line);
        background: #fafbfd;
      }
      .comparison {
        display: grid;
        grid-template-columns: 1fr 28px 1fr;
        align-items: center;
        gap: 10px;
        margin: 22px 0;
      }
      .comparison > div {
        padding: 17px;
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .comparison strong {
        display: block;
        font-size: 28px;
        margin-top: 5px;
      }
      .comparison .target {
        border-color: #b8cbef;
        background: var(--blue-pale);
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: #182333;
        border-radius: 8px;
        padding: 13px 20px;
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.15);
        max-width: calc(100% - 30px);
        z-index: 5;
      }
      .toast:empty {
        display: none;
      }
      .empty {
        text-align: center;
        padding: 45px 20px;
      }
      .stack > * + * {
        margin-top: 12px;
      }
      .spaced {
        margin-top: 24px;
      }
      [hidden] {
        display: none !important;
      }
      .skip {
        position: absolute;
        left: 10px;
        top: -100px;
        z-index: 10;
        background: white;
        padding: 12px;
      }
      .skip:focus {
        top: 8px;
      }
      .wizard-steps {
        display: flex;
        gap: 20px;
        padding: 0;
        margin: 0 0 26px;
        list-style: none;
        color: var(--muted);
        font-size: 12px;
      }
      .wizard-steps li {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .wizard-steps span {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: var(--canvas);
        border: 1px solid var(--line);
      }
      .wizard-steps [aria-current="step"] {
        color: var(--blue);
        font-weight: 700;
      }
      .wizard-steps [aria-current="step"] span {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .wizard-select {
        width: 100%;
      }
      .destination-list {
        padding: 0;
        margin: 0;
        border: 0;
      }
      .destination {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 7px;
        margin: 11px 0;
        cursor: pointer;
      }
      .destination:has(input:checked) {
        border-color: var(--blue);
        background: var(--blue-pale);
      }
      .destination input {
        margin-top: 4px;
        min-height: 16px;
        accent-color: var(--blue);
        flex-shrink: 0;
      }
      .destination strong,
      .destination small {
        display: block;
      }
      .destination.unavailable {
        cursor: default;
        background: var(--canvas);
      }
      .restriction {
        color: var(--amber);
        margin-top: 5px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      @media (max-width: 1050px) {
        main {
          padding: 25px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .shell {
          grid-template-columns: 195px minmax(0, 1fr);
        }
      }
      @media (max-width: 700px) {
        .demo {
          align-items: flex-start;
          padding: 10px 15px;
          flex-direction: column;
          gap: 8px;
        }
        .demo-controls {
          flex-wrap: wrap;
        }
        .shell {
          display: block;
        }
        aside {
          padding: 15px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          padding: 0;
        }
        .workspace,
        .account,
        .nav-divider {
          display: none;
        }
        nav {
          margin-top: 14px;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        nav a {
          padding: 8px 10px;
          font-size: 12px;
          white-space: nowrap;
        }
        nav svg {
          display: none;
        }
        main {
          padding: 23px 17px 55px;
        }
        h1 {
          font-size: 25px;
        }
        .heading {
          flex-direction: column;
        }
        .stat-grid {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .stat {
          padding: 13px 17px;
        }
        .stat strong {
          font-size: 23px;
        }
        .env-context {
          flex-wrap: wrap;
          padding: 14px;
          gap: 12px;
        }
        .env-context select {
          min-width: 130px;
          max-width: 100%;
        }
        .env-context .tag {
          margin-left: 0;
        }
        .card {
          padding: 19px;
        }
        th,
        td {
          padding: 13px 16px;
        }
      }
      .application-bar {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 25px;
        border-bottom: 1px solid var(--line);
        background: white;
        position: sticky;
        top: 0;
        z-index: 2;
        min-height: 72px;
      }
      .area-nav {
        flex-direction: row;
        gap: 8px;
      }
      .area-nav a {
        padding: 10px 15px;
      }
      .operations-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #23436f;
        font-size: 18px;
      }
      .operations-brand svg {
        width: 23px;
        height: 23px;
      }
      .operations-scope {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: auto;
      }
      .operations-scope label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
      }
      .operations-scope select {
        display: block;
        margin-top: 4px;
        min-width: 160px;
      }
      .operations-scope .tag {
        align-self: center;
      }
      .section-label {
        margin: 0 13px 9px;
      }
      body[data-mode="operations"] .application-bar {
        background: #edf2fa;
        border-bottom-color: #c5d3e8;
      }
      body[data-mode="operations"] aside {
        background: #f8fafd;
      }
      body[data-mode="operations"] .shell {
        min-height: calc(100vh - 145px);
      }
      @media (max-width: 1100px) {
        .application-bar {
          flex-wrap: wrap;
        }
        .operations-scope {
          order: 3;
          flex-basis: 100%;
          margin-left: 0;
        }
        #operations-exit {
          margin-left: auto;
        }
      }
      @media (max-width: 700px) {
        .application-bar {
          padding: 12px 15px;
          gap: 12px;
          position: static;
        }
        .area-nav {
          display: flex;
          margin: 0;
          gap: 3px;
          flex-wrap: wrap;
        }
        .area-nav a {
          padding: 8px 10px;
        }
        .operations-scope {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 10px;
        }
        .operations-scope select {
          min-width: 0;
          width: 100%;
        }
        .operations-scope .tag {
          justify-self: start;
        }
        .section-label {
          margin: 15px 10px 0;
        }
        .operations-brand {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="demo">
      <div><strong>Navigation concept</strong> <small> · Interactive sample data</small></div>
      <div class="demo-controls">
        <label for="persona">Explore as</label>
        <select id="persona">
          <option value="all">Alex · Full access</option>
          <option value="editor">Alex · Editor</option>
          <option value="testeditor">Alex · Test-only editor</option>
          <option value="approver">Morgan · Approver</option>
          <option value="responses">Riley · Response operator</option>
          <option value="owner">Alex · Site owner</option>
        </select>
        <button id="reset">Reset demo</button>
      </div>
    </header>
    <div class="application-bar" role="region" aria-label="Application navigation">
      <div id="application-area"></div>
      <div id="operations-scope" class="operations-scope"></div>
      <div id="operations-exit"></div>
    </div>
    <div class="shell">
      <aside>
        <div class="brand"><span class="brand-mark">q</span> QCMS</div>
        <div class="workspace"><small>Workspace</small><strong>Customer experience</strong></div>
        <div id="section-label" class="eyebrow section-label"></div>
        <nav id="nav" aria-label="Primary"></nav>
        <div class="account" id="account"></div>
      </aside>
      <main id="main" tabindex="-1"><div class="content" id="content"></div></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div class="toast" role="status" id="toast"></div>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const escape = (value) =>
        String(value).replace(
          /[&<>"']/g,

          html +=
            '<div class="card"><h2>' +
            escape(envName(s.env)) +
            ' webhook</h2><p class="muted">Only submissions in this environment use this endpoint.</p><p><strong>Active endpoint</strong><br>' +
            escape(r.webhook) +
            '</p><label class="field">New endpoint<input id="webhook-url" type="url" value="' +
            escape(r.webhook) +
            '"></label>' +
            button(
              config.second && isProtected(s.env) ? "Propose endpoint change" : "Update endpoint",
              "webhook",
              "",
              true,
              !canOperate(s.env),
            ) +
            (r.proposal
              ? '<div class="notice spaced"><strong>Pending proposal</strong><p>' +
                escape(r.proposal.url) +
                "<br>Proposed by " +
                escape(r.proposal.author) +
                "</p>" +
                button(
                  "Confirm endpoint change",
                  "confirm-webhook",
                  "",
                  false,
                  !canOperate(s.env) || r.proposal.author === person().name,
                ) +
                "</div>"
              : "") +
            "</div>";
        }

        return html;
      }
      function administrationView() {
        return (
          header(
            "Release flow",
            "Choose how this installation moves published versions between environments.",
          ) +
          '<div class="grid"><form id="flow-form" class="card"><h2>Environments and release rules</h2><p class="muted">Set the destinations your team needs. Authoring remains shared.</p><label class="field">Start with a flow<select id="flow-preset"><option value="custom">Current configuration</option><option value="single">Production only</option><option value="pair">Test → Production</option><option value="four">Dev → Test → Staging → Production</option><option value="flexible">Flexible destinations</option></select></label><label class="field">Environment names, in order<input id="flow-envs" value="' +
          escape(config.envs.join(", ")) +
          '" required pattern="[a-z][a-z0-9_-]*(, *[a-z][a-z0-9_-]*)*"><small>Comma-separated names, for example: dev, test, stg, prod.</small></label><label class="field">Protected production environment<input id="flow-protected" value="' +
          escape(config.protected) +
          '" required></label><label class="check"><input type="checkbox" id="flow-sequential"' +
          (config.sequential ? " checked" : "") +
          '><span><strong>Require the preceding environment</strong><br><small>Each candidate must have been released to the preceding environment before it can advance.</small></span></label><label class="check"><input type="checkbox" id="flow-multi"' +
          (config.multi ? " checked" : "") +
          '><span><strong>Allow publishing to multiple environments</strong><br><small>Each selected environment must already meet its release prerequisites. One selection cannot satisfy another environment’s prerequisite.</small></span></label><label class="check"><input type="checkbox" id="flow-second"' +
          (config.second ? " checked" : "") +
          '><span><strong>Require a different production approver</strong><br><small>The account that published a version cannot release it to production.</small></span></label><button class="primary" type="submit">Apply demo flow</button><p class="spaced"><small>Changing the flow resets the sample releases so you can explore another setup.</small></p></form><div class="card"><div class="eyebrow">Configured by the owner</div><h2>Your flow, your destinations</h2><p class="muted">The release screen uses these names and rules. Adding an environment does not add another question library or form draft.</p><p class="muted">Production operations require an approver. Response access is always granted separately.</p><div class="notice">Concept configuration. These controls do not change the running installation.</div></div></div>'
        );
      }
      function modal(body, footer, cancellable = true) {
        $("#dialog-content").innerHTML =
          '<div class="dialog-body">' +
          body +
          '</div><div class="dialog-actions">' +
          (cancellable ? button("Cancel", "cancel") : "") +
          footer +
          "</div>";
        $("#dialog").showModal();
      }
      function closeModal() {
        $("#dialog").close();
        wizard = null;
      }
      function snapshot(version) {
        modal(
          '<div class="eyebrow">Immutable published content</div><h2 id="dialog-title">Version ' +
            version.number +
            '</h2><p class="muted">Published by ' +
            escape(version.author) +
            "</p><h3>" +
            escape(version.title) +
            '</h3><div class="question-row"><span class="number">1</span><div><strong>' +
            escape(version.question) +
            '</strong><div class="mini-input"></div></div></div><p class="muted spaced">' +
            escape(version.note) +
            "</p>",
          button("Done", "cancel", "", true),
        );
      }
      function wizardCandidate() {
        return wizard.selection === "draft"
          ? wizard.draftVersion
          : versions.find((v) => v.number === Number(wizard.selection));
      }
      function destinationReason(env) {
        const candidate = wizardCandidate();
        if (wizard.selection !== "draft" && record(env).version === candidate.number)
          return "This version is already available here.";
        return eligibility(env, candidate);
      }
      function startWizard() {
        wizard = {
          step: 1,
          selection:
            person().edit && state().tab === "draft" ? "draft" : String(versions[0].number),
          draftVersion: person().edit ? publishedVersion() : null,
          targets: null,
          library: false,
          expected: {},
        };
        renderWizard();
      }
      function renderWizard() {
        const candidate = wizardCandidate();
        const combined = wizard.selection === "draft";
        const accessible = config.envs.filter(canOperate);
        const progress =
          '<ol class="wizard-steps" aria-label="Publishing progress">' +
          ["Version", "Environment", "Review"]
            .map(
              (name, index) =>
                "<li" +
                (wizard.step === index + 1 ? ' aria-current="step"' : "") +
                "><span>" +
                (index + 1) +
                "</span>" +
                name +
                "</li>",
            )
            .join("") +
          "</ol>";
        let body = progress;
        let footer = wizard.step > 1 ? button("Back", "wizard-back") : "";
        if (wizard.step === 1) {
          body +=
            '<h2 id="dialog-title" tabindex="-1">What would you like to publish?</h2><p class="muted">Create a new version from the shared draft, or make an existing version available elsewhere.</p><label class="field" for="wizard-version">Version</label><select id="wizard-version" class="wizard-select" aria-label="Version">' +
            (person().edit
              ? '<option value="draft"' +
                (combined ? " selected" : "") +
                ">Current draft · create v" +
                wizard.draftVersion.number +
                "</option>"
              : "") +
            versions
              .map(
                (v) =>
                  '<option value="' +
                  v.number +
                  '"' +
                  (wizard.selection === String(v.number) ? " selected" : "") +
                  ">v" +
                  v.number +
                  " · " +
                  escape(v.author) +
                  "</option>",
              )
              .join("") +
            '</select><div class="card spaced"><h3>' +
            escape(candidate.title) +
            "</h3><p>" +
            escape(candidate.question) +
            "</p><small>" +
            (combined
              ? "A new immutable snapshot will be created when you confirm."
              : "This published version will be reused exactly as it is.") +
            "</small></div>";
          if (combined && (!candidate.title.trim() || !candidate.question.trim()))
            body +=
              '<div class="notice amber">The draft needs a form title and contact question before it can be published.</div>';
          footer += button(
            "Continue",
            "wizard-next",
            "",
            true,
            combined && (!candidate.title.trim() || !candidate.question.trim()),
          );
        } else if (wizard.step === 2) {
          if (wizard.targets === null) {
            const first = accessible.find((env) => !destinationReason(env));
            wizard.targets = first ? [first] : [];
            wizard.library = !first && combined;
          }
          body +=
            '<h2 id="dialog-title" tabindex="-1">Where should v' +
            candidate.number +
            ' be available?</h2><p class="muted">' +
            (config.multi
              ? "Choose one or more accessible environments. Each destination must meet the site’s release rules independently."
              : "Choose one accessible environment. This site allows one destination per publication.") +
            '</p><fieldset class="destination-list"><legend class="sr-only">Destination environments</legend>';
          body += accessible
            .map((env) => {
              const reason = destinationReason(env);
              return (
                '<label class="destination' +
                (reason ? " unavailable" : "") +
                '"><input type="' +
                (config.multi ? "checkbox" : "radio") +
                '" name="wizard-environment" value="' +
                env +
                '"' +
                (wizard.targets.includes(env) && !reason ? " checked" : "") +
                (reason ? " disabled" : "") +
                "><span><strong>" +
                escape(envName(env)) +
                "</strong><small>Currently v" +
                record(env).version +
                " · Intake " +
                (record(env).closed ? "closed" : "open") +
                "</small>" +
                (reason ? '<small class="restriction">' + escape(reason) + "</small>" : "") +
                "</span></label>"
              );
            })
            .join("");
          if (combined)
            body +=
              '<label class="destination"><input type="' +
              (config.multi ? "checkbox" : "radio") +
              '" name="wizard-environment" value="library"' +
              (wizard.library ? " checked" : "") +
              "><span><strong>Create version for later release</strong><small>No environment changes. This choice replaces any selected destinations.</small></span></label>";
          body += "</fieldset>";
          if (!accessible.length)
            body +=
              '<div class="notice amber">Your role has no accessible release environments.' +
              (combined
                ? " You can still create a version for an approver."
                : " Ask the site owner for the appropriate environment access.") +
              "</div>";
          if (config.multi && wizard.targets.length)
            body +=
              "<p><small>" +
              wizard.targets.length +
              " environment" +
              (wizard.targets.length === 1 ? "" : "s") +
              " selected. One version will be used for every destination.</small></p>";
          footer += button(
            "Review",
            "wizard-next",
            "",
            true,
            !wizard.library &&
              (!wizard.targets.length || wizard.targets.some((env) => destinationReason(env))),
          );
        } else {
          const targets = selectedTargets();
          const reasons = targets.map(destinationReason).filter(Boolean);
          body +=
            '<h2 id="dialog-title" tabindex="-1">' +
            (wizard.library
              ? "Review version publication"
              : targets.length === 1
                ? "Review publication to " + escape(envName(targets[0]))
                : "Review publication to " + targets.length + " environments") +
            '</h2><p class="muted">Customer onboarding · ' +
            (combined
              ? "Create one new immutable version"
              : "Reuse one existing immutable version") +
            "</p>";
          if (wizard.library)
            body +=
              '<div class="card"><small>New published version</small><h3>v' +
              candidate.number +
              "</h3></div>";
          else
            body += targets
              .map(
                (env) =>
                  '<section class="card"><h3>' +
                  escape(envName(env)) +
                  '</h3><div class="comparison"><div><small>Currently released</small><strong>v' +
                  record(env).version +
                  '</strong></div><span aria-hidden="true">→</span><div class="target"><small>Version to publish</small><strong>v' +
                  candidate.number +
                  "</strong></div></div><small>Intake " +
                  (record(env).closed
                    ? "will remain closed. Reopen separately when ready."
                    : "is open.") +
                  "</small>" +
                  (record(env).version > candidate.number
                    ? "<p><strong>This is a rollback.</strong> Existing sessions and operational settings are preserved.</p>"
                    : "") +
                  "</section>",
              )
              .join("");
          body +=
            "<h3>Content to publish</h3><p>" +
            escape(candidate.title) +
            '<br><span class="muted">Contact question: ' +
            escape(candidate.question) +
            "</span></p><p><small>" +
            (combined ? "Will be published by " : "Originally published by ") +
            escape(candidate.author) +
            "</small></p>";
          const evidence = config.envs.filter((env) =>
            record(env).history.includes(candidate.number),
          );
          if (!combined && evidence.length)
            body +=
              "<p><small>Previously released in " +
              evidence.map(envName).map(escape).join(", ") +
              ". This does not record a successful test.</small></p>";
          body +=
            '<div class="notice' +
            (reasons.length ? " amber" : "") +
            '">' +
            (reasons.length
              ? reasons.map(escape).join("<br>")
              : wizard.library
                ? "No environment changes. This version will be available for a future release."
                : "One confirmation updates all " +
                  targets.length +
                  " selected destination" +
                  (targets.length === 1 ? "" : "s") +
                  ". Existing sessions keep their original version.") +
            "</div>";
          footer += button(
            wizard.library
              ? "Publish v" + candidate.number
              : targets.length === 1
                ? "Publish v" + candidate.number + " to " + envName(targets[0])
                : "Publish v" + candidate.number + " to " + targets.length + " environments",
            "wizard-confirm",
            "",
            true,
            Boolean(reasons.length),
          );
        }
        modal(body, footer);
        $("#dialog-title").focus({ preventScroll: true });
      }
      function selectedTargets() {
        return config.envs.filter((env) => (wizard.targets || []).includes(env));
      }
      function confirmWizard() {
        if (!wizard || wizard.step !== 3) return;
        const candidate = wizardCandidate();
        const combined = wizard.selection === "draft";
        const targets = selectedTargets();
        if (wizard.library && (!combined || !person().edit || targets.length)) return;
        if (!wizard.library && (!targets.length || (!config.multi && targets.length > 1))) return;
        const reason = targets.map(destinationReason).find(Boolean);
        if (reason) {
          wizard.targets = targets.filter((env) => !destinationReason(env));
          wizard.step = 2;
          renderWizard();
          return notify(reason);
        }
        const changed = targets.filter((env) => record(env).version !== wizard.expected[env]);
        if (changed.length) {
          for (const env of targets) wizard.expected[env] = record(env).version;
          renderWizard();
          return notify(
            "A destination changed. Review all current versions before confirming again.",
          );
        }
        if (combined) versions.unshift(candidate);
        for (const env of targets) {
          record(env).version = candidate.number;
          record(env).history.push(candidate.number);
          historyEntries.unshift(
            "v" + candidate.number + " released to " + envName(env) + " by " + person().name + ".",
          );
        }
        wizard.step = 4;
        navigate("form", "versions");
        modal(
          '<div class="eyebrow">Publication complete</div><h2 id="dialog-title" tabindex="-1">v' +
            candidate.number +
            (wizard.library
              ? " is ready for release"
              : targets.length === 1
                ? " is available in " + escape(envName(targets[0]))
                : " is available in " + targets.length + " environments") +
            "</h2><p>" +
            (wizard.library
              ? "The immutable version is in the version library. No environment changed."
              : "The same immutable version is now available in every selected environment.") +
            "</p>" +
            targets
              .map(
                (env) =>
                  "<p>" +
                  tag(envName(env), "blue") +
                  " Intake " +
                  (record(env).closed ? "remains closed." : "is open.") +
                  "</p>",
              )
              .join("") +
            (!wizard.library
              ? '<div class="notice">Existing sessions keep their original version.</div>'
              : ""),
          button("Done", "cancel") +
            targets
              .map((env) =>
                button(
                  "Open " + envName(env) + " operations",
                  "wizard-operations",
                  'data-env="' + env + '"',
                  targets.length === 1,
                ),
              )
              .join(""),
          false,
        );
        $("#dialog-title").focus({ preventScroll: true });
      }
      function publishedVersion() {
        return {
          number: versions[0].number + 1,
          author: person().name,
          title: draft.title,
          question: draft.question,
          note:
            "Updated contact question: " +
            draft.question +
            (draft.company ? "; includes optional company name." : "."),
        };
      }
      function captureDraft() {
        if ($("#draft-title"))
          draft = {
            title: $("#draft-title").value,
            question: $("#draft-question").value,
            company: $("#draft-company").checked,
          };
      }
      document.addEventListener("click", (event) => {
        const el = event.target.closest("[data-action]");
        if (!el || el.disabled) return;
        const action = el.dataset.action;
        const s = state();
        captureDraft();
        if (action === "cancel") return closeModal();
        if (action === "preview")
          modal(
            '<div class="eyebrow">Draft preview · Hypothetical answers</div><h2 id="dialog-title">' +
              escape(draft.title) +
              '</h2><label class="field">' +
              escape(draft.question) +
              '<input type="email" placeholder="you@example.com"></label>' +
              (draft.company
                ? '<label class="field">Company name <span class="muted">(optional)</span><input></label>'
                : "") +
              '<p class="muted">This preview creates no respondent session.</p>',
            button("Done", "cancel", "", true),
          );
        if (action === "update-question") {
          draft.question = questionLabel;
          render();
          notify("Draft reference updated. Published versions are unchanged.");
        }
        if (action === "publish-question" && person().edit) {
          questionLabel = $("#library-label").value;
          notify("New question version published. Update the form draft to use it.");
        }
        if (action === "snapshot")
          snapshot(versions.find((v) => v.number === Number(el.dataset.version)));
        if (action === "publish-wizard" && canReadForms()) startWizard();
        if (action === "wizard-back" && wizard) {
          wizard.step -= 1;
          renderWizard();
        }
        if (action === "wizard-next" && wizard) {
          if (wizard.step === 1) {
            if (
              wizard.selection === "draft" &&
              (!wizardCandidate().title.trim() || !wizardCandidate().question.trim())
            )
              return;
            wizard.step = 2;
          } else if (wizard.step === 2) {
            const targets = selectedTargets();
            if (!wizard.library && (!targets.length || targets.some(destinationReason))) return;
            wizard.expected = Object.fromEntries(targets.map((env) => [env, record(env).version]));
            wizard.step = 3;
          }
          renderWizard();
        }
        if (action === "wizard-confirm") confirmWizard();
        if (action === "wizard-operations" && wizard?.step === 4) {
          const env = el.dataset.env;
          if (!selectedTargets().includes(env)) return;
          closeModal();
          navigate("operations", "overview", env);
        }
        if (action === "intake" && canOperate(s.env)) {
          record(s.env, s.form).closed = !record(s.env, s.form).closed;
          render();
          notify(
            envName(s.env) + " intake " + (record(s.env, s.form).closed ? "closed." : "reopened."),
          );
        }
        if (action === "create-link" && canOperate(s.env)) {
          const r = record(s.env, s.form);
          r.links.push({
            path:
              (isProtected(s.env) ? "" : "/" + s.env) + "/l/sample-link-" + (r.links.length + 1),
            revoked: false,
          });
          render();
          notify("Sample secure link created for " + envName(s.env) + ".");
        }
        if (action === "revoke-link" && canOperate(s.env)) {
          record(s.env, s.form).links[Number(el.dataset.index)].revoked = true;
          render();
          notify("Link revoked in " + envName(s.env) + ".");
        }
        if (action === "export" && person().responses) {
          const csv =
            "session,environment,form,version,status\nsample-001," +
            s.env +
            "," +
            s.form +
            "," +
            record(s.env, s.form).version +
            ",submitted\n";
          const objectUrl = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
          const anchor = document.createElement("a");
          anchor.href = objectUrl;
          anchor.download = "sample-" + s.env + "-responses.csv";
          anchor.click();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
          notify("Sample " + envName(s.env) + " responses exported.");
        }
        if (action === "webhook" && canOperate(s.env)) {
          const input = $("#webhook-url");
          if (!input.reportValidity()) return;
          let endpoint;
          try {
            endpoint = new URL(input.value);
          } catch {
            return notify("Enter a valid HTTPS endpoint.");
          }
          if (endpoint.protocol !== "https:") return notify("Use an HTTPS endpoint.");
          const r = record(s.env, s.form);
          if (config.second && isProtected(s.env))
            r.proposal = { url: endpoint.href, author: person().name };
          else r.webhook = endpoint.href;
          render();
          notify(
            r.proposal
              ? "Proposal pending. A different approver must confirm."
              : "Endpoint updated in " + envName(s.env) + ".",
          );
        }
        if (action === "confirm-webhook" && canOperate(s.env)) {
          const r = record(s.env, s.form);
          if (r.proposal && r.proposal.author !== person().name) {
            r.webhook = r.proposal.url;
            r.proposal = null;
            render();
            notify("Endpoint change confirmed.");
          }
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id.startsWith("draft-")) captureDraft();
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "wizard-version" && wizard) {
          wizard.selection = event.target.value;
          wizard.targets = null;
          wizard.library = false;
          renderWizard();
          $("#wizard-version").focus();
        }
        if (event.target.name === "wizard-environment" && wizard) {
          const control = event.target.value;
          if (control === "library") {
            wizard.library = event.target.checked;
            if (wizard.library) wizard.targets = [];
          } else {
            wizard.library = false;
            wizard.targets = event.target.checked
              ? config.multi
                ? [...new Set([...wizard.targets, control])]
                : [control]
              : wizard.targets.filter((env) => env !== control);
          }
          renderWizard();
          document
            .querySelector('input[name="wizard-environment"][value="' + control + '"]')
            ?.focus();
        }
        if (event.target.id === "draft-company") captureDraft();
        if (event.target.id === "ops-env" || event.target.id === "ops-form")
          navigate("operations", state().tab, $("#ops-env").value, $("#ops-form").value);
        if (event.target.id === "flow-preset") {
          const presets = {
            single: ["prod"],
            pair: ["test", "prod"],
            four: ["dev", "test", "stg", "prod"],
            flexible: ["dev", "test", "stg", "prod"],
          };
          const names = presets[event.target.value];
          if (names) {
            $("#flow-envs").value = names.join(", ");
            $("#flow-protected").value = "prod";
            $("#flow-sequential").checked = event.target.value !== "flexible" && names.length > 1;
            $("#flow-multi").checked = event.target.value === "flexible";
          }
        }
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id !== "flow-form") return;
        event.preventDefault();
        const envs = $("#flow-envs")
          .value.split(",")
          .map((x) => x.trim());
        const protectedEnv = $("#flow-protected").value.trim();
        if (!envs.includes(protectedEnv))
          return notify("The protected production environment must be in the environment list.");
        if (new Set(envs).size !== envs.length)
          return notify("Use a unique name for each environment.");
        seed({
          envs,
          protected: protectedEnv,
          sequential: $("#flow-sequential").checked,
          multi: $("#flow-multi").checked,
          second: $("#flow-second").checked,
        });
        render();
        notify("Demo flow applied.");
      });
      $("#persona").addEventListener("change", (event) => {
        captureDraft();
        if ($("#dialog").open) closeModal();
        role = event.target.value;
        navigate(
          canReadForms() ? "form" : person().responses ? "operations" : "administration",
          canReadForms() ? "versions" : "overview",
          state().env,
        );
      });
      $("#reset").addEventListener("click", () => {
        if ($("#dialog").open) closeModal();
        seed();
        role = "all";
        $("#persona").value = role;
        navigate("forms");
        notify("Sample data reset.");
      });
      $("#dialog").addEventListener("click", (event) => {
        if (event.target === $("#dialog")) closeModal();
      });
      window.addEventListener("hashchange", () => {
        render();
        $("#main").focus({ preventScroll: true });
      });
      seed();
      render();
    </script>
  </body>
</html>
