packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"

ignoredOptionalDependencies:
  - sharp

overrides:
  postcss: ^8.5.23
  minimatch@5: ^10.2.5
  minimatch@9: ^10.2.5
  brace-expansion@5: ^5.0.8
  esbuild@0.18.20: ^0.25.12

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.51'
  - '@ai-sdk/google@4.0.43'
  - '@ai-sdk/openai@4.0.41'
  - ai@7.0.64
