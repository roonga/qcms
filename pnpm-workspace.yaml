packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"

ignoredOptionalDependencies:
  - sharp

# Supply-chain release-age hold (SEC-11, issue #455). A version published in the
# last 24 hours is not installed at all, and a resolution that needs one now
# fails instead of silently writing itself a minimumReleaseAgeExclude entry.
# Both keys are set on purpose: minimumReleaseAgeStrict defaults to true only
# when minimumReleaseAge is itself explicitly configured, so setting strict
# beside an inherited default would be a policy nothing enforces. 1440 is
# pnpm 11's own default, restated here to make the pair real.
# CONTRIBUTING.md, "The release-age hold", says what to do when it refuses.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  postcss: ^8.5.23
  minimatch@5: ^10.2.5
  minimatch@9: ^10.2.5
  brace-expansion@5: ^5.0.9
  esbuild@0.18.20: ^0.25.12
  # A FLOOR, not a fix (Code Owner, 2026-10-11, issue #1050). GHSA-pqg4-j6r4-53mv is
  # already closed by the lockfile refresh in the same change: `launch-editor@2.14.1`
  # declares `shell-quote: ^1.8.4`, which admits the patched line, so refreshing moved
  # the single resolution from 1.10.0 to 1.12.0 and `pnpm audit` is clean without this
  # line. It is here to keep the floor above the vulnerable range rather than to reach
  # it. Unscoped because the one consumer in the tree is already on major 1.
  # CONTRIBUTING's overrides table carries the reason and the removal condition, and
  # says plainly which of the two closed the advisory.
  shell-quote: ^1.11.0

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
