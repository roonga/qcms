packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"

ignoredOptionalDependencies:
  - sharp

# Supply-chain release-age hold (SEC-11, issue #455). A version published in the
# last 24 hours is not installed at all, and a resolution that needs one now
# fails instead of silently writing itself a minimumReleaseAgeExclude entry.
# Both keys are set on purpose: minimumReleaseAgeStrict defaults to true only
# when minimumReleaseAge is itself explicitly configured, so setting strict
# beside an inherited default would be a policy nothing enforces. 1440 is
# pnpm 11's own default, restated here to make the pair real.
# CONTRIBUTING.md, "The release-age hold", says what to do when it refuses.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  postcss: ^8.5.23
  minimatch@5: ^10.2.5
  minimatch@9: ^10.2.5
  brace-expansion@5: ^5.0.9
  esbuild@0.18.20: ^0.25.12

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true

# pnpm 11 refuses a dependency version younger than its built-in minimum release age.
# `pnpm add` writes an exact-version exception here for each package it had to waive,
# and the exceptions below are the ones task 041's Vercel AI SDK packages needed. Every
# entry is pinned to a single version, so an exception can never silently widen to a
# later release. Whether `minimumReleaseAgeStrict` should also be on is a Code Owner
# call, tracked on issue #455 along with documenting the policy beside CONTRIBUTING's
# dependency thresholds.
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.49'
  - '@ai-sdk/gateway@4.0.74'
  - '@ai-sdk/google@4.0.63'
  - '@ai-sdk/openai@4.0.58'
  - ai@7.0.92
