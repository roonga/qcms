packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"

ignoredOptionalDependencies:
  - sharp

# Set both keys: inheriting the release-age default does not enable strict refusal.
# See CONTRIBUTING.md for handling a dependency held by the supply-chain delay.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  "drizzle-orm>@opentelemetry/api": ~1.9.1
  "@hono/otel>@opentelemetry/api": ~1.9.1
  postcss: ^8.5.23
  minimatch@5: ^11.0.1
  minimatch@9: ^11.0.1
  minimatch@10: ^11.0.1
  glob@10: ^14.0.2
  glob@13: ^14.0.2
  brace-expansion@5: ^5.0.9
  esbuild@0.18.20: ^0.25.12

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
