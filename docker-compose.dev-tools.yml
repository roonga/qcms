# Development tools must bind only to loopback, regardless of deployment bind settings.
# Telemetry is privacy-reduced before export and disappears when the collector restarts.
services:
  # Copy dashboard provisioning into the image: the host daemon cannot resolve dev-container bind paths.
  lgtm:
    image: qcms-lgtm:local
    build:
      context: .
      dockerfile: docker/lgtm.Dockerfile
      args:
        QCMS_LGTM_IMAGE: ${QCMS_LGTM_IMAGE:-grafana/otel-lgtm:latest}
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/qcms/qcms-observability.json
    ports:
      # Keep OTLP ingestion internal to the Compose network.
      - "127.0.0.1:${QCMS_OBSERVABILITY_PORT:-7050}:3000"
    restart: unless-stopped

  # Create the read-only role on every up; initdb scripts miss existing databases.
  # Keep SQL inline because the host daemon cannot resolve dev-container repository paths.
  dev-tools-role:
    image: ${QCMS_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      PGHOST: postgres
      PGDATABASE: ${QCMS_DB_NAME:-qcms}
      PGUSER: ${QCMS_DB_USER:-qcms}
      PGPASSWORD: ${QCMS_DB_PASSWORD:?set QCMS_DB_PASSWORD in .env}
      RO_PASSWORD: ${QCMS_DB_VIEWER_PASSWORD:?set QCMS_DB_VIEWER_PASSWORD in .env - the dev-tools overlay creates a read-only role with it}
    # Use psql getenv to keep passwords out of argv; quote the heredoc to prevent shell expansion.
    # Repeat runs must rotate existing role passwords.
    entrypoint:
      - sh
      - -c
      - |
        exec psql <<'SQL'
        \set ON_ERROR_STOP on
        \getenv ro_password RO_PASSWORD

        SELECT 'CREATE ROLE qcms_ro LOGIN'
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'qcms_ro')\gexec

        ALTER ROLE qcms_ro WITH LOGIN PASSWORD :'ro_password';
        ALTER ROLE qcms_ro SET default_transaction_read_only = on;
        GRANT pg_read_all_data TO qcms_ro;
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pgweb:
    image: ${QCMS_PGWEB_IMAGE:-sosedoff/pgweb:latest}
    # Read-only is a command-line flag, not an environment option.
    # The database role enforces privileges; client settings and blocklists are only defense in depth.
    command: ["--readonly"]
    environment:
      PGWEB_DATABASE_URL: postgres://qcms_ro:${QCMS_DB_VIEWER_PASSWORD:?set QCMS_DB_VIEWER_PASSWORD in .env - the dev-tools overlay creates a read-only role with it}@postgres:5432/${QCMS_DB_NAME:-qcms}?sslmode=disable
    ports:
      - "127.0.0.1:${QCMS_DB_VIEWER_PORT:-7060}:8081"
    depends_on:
      dev-tools-role:
        condition: service_completed_successfully
    restart: unless-stopped

  # Seeding must be opt-in so empty-library investigations remain possible.
  # Keep sample-data writers outside the shipped topology and on this stack's private network.
  seed:
    profiles: ["seed"]
    image: qcms-seed:local
    build:
      context: .
      dockerfile: docker/seed.Dockerfile
      args:
        QCMS_API_IMAGE: ${QCMS_API_IMAGE:-qcms-api:local}
    # Pass DATABASE_URL by environment name through compose run, never as an argv value.
    # A required-variable declaration would break unrelated commands: Compose interpolates profiled services too.
    # The preflight also scans comment text for required-variable syntax.
    depends_on:
      # A healthy database may still have no tables; wait for migrations before seeding.
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Each app supplies its own service name; a shared Compose value would collapse telemetry identities.
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
    depends_on:
      lgtm:
        # The collector has no healthcheck; early spans may be dropped before it starts listening.
        condition: service_started

  portal:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
    depends_on:
      lgtm:
        condition: service_started

  admin:
    environment:
      # Local credential links must never be enabled by the base deployment.
      QCMS_DEV_LOGIN_PREFILL: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
    depends_on:
      lgtm:
        condition: service_started
